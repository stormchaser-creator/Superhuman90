<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SH90">
  <meta name="theme-color" content="#0ea5e9">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ytimg.com; connect-src 'self' https://xwhotgkmlbqcyjpdhlbt.supabase.co https://generativelanguage.googleapis.com; manifest-src 'self';">
  <title>Superhuman90</title>

  <!-- PWA Manifest + Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    textarea { font-family: 'DM Sans', sans-serif; }
    .safe-top { padding-top: 44px; padding-top: env(safe-area-inset-top, 44px); }
  </style>

  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js" integrity="sha384-pKNXKj7jF9BNMkQyGWg5YLfoPyqBa/gf7wjTSoTGQlwxbZB+sabJuKyOHR6JQvTd" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Local date helper (timezone-safe) ──
    const toLocalDateStr = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };

    // ── localStorage helpers ──
    const sanitizeString = (val, maxLen = 500) =>
      typeof val === "string" ? val.slice(0, maxLen) : "";
    const sanitizeNumber = (val, min = 0, max = 9999) => {
      const n = Number(val);
      return Number.isFinite(n) ? Math.min(Math.max(n, min), max) : min;
    };
    const loadState = (key, fallback) => {
      try {
        const saved = localStorage.getItem("sh90_" + key);
        if (!saved) return fallback;
        const parsed = JSON.parse(saved);
        if (fallback !== null && typeof parsed !== typeof fallback) return fallback;
        if (Array.isArray(fallback) && !Array.isArray(parsed)) return fallback;
        return parsed;
      } catch { return fallback; }
    };
    const loadProfile = () => {
      const raw = loadState("profile", { name: "", age: "", height: "", goalWeight: "", notes: "" });
      return {
        name: sanitizeString(raw.name, 100),
        age: sanitizeString(raw.age, 3),
        height: sanitizeString(raw.height, 10),
        goalWeight: sanitizeString(raw.goalWeight, 10),
        notes: sanitizeString(raw.notes, 1000),
      };
    };
    const saveState = (key, value) => {
      try { localStorage.setItem("sh90_" + key, JSON.stringify(value)); } catch (e) { console.warn("SH90: localStorage write failed for " + key + ":", e); }
    };

    // ── Supabase Setup ──
    const SUPABASE_URL = "https://xwhotgkmlbqcyjpdhlbt.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3aG90Z2ttbGJxY3lqcGRobGJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwNjA5NTksImV4cCI6MjA4NzYzNjk1OX0.VI7sMUCh-IxSCSEouagYNBBIuQExbhF7uePSO0oNuXc";
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // Device ID: persistent anonymous identifier
    const OLD_DEFAULT_DEVICE = "aaae86fd-3725-4650-9fbd-2fc8d55efd41";
    const clearAllSh90Data = () => {
      var staleKeys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.startsWith("sh90_")) staleKeys.push(k);
      }
      staleKeys.forEach(function(k) { localStorage.removeItem(k); });
    };
    const getDeviceId = () => {
      var params = new URLSearchParams(window.location.search);
      var urlDevice = params.get("device");
      if (urlDevice) {
        var existingId = localStorage.getItem("sh90_device_id");
        var uuidOk = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(urlDevice);
        // Silent identity rebinding is an account-takeover primitive — validate and confirm
        if (uuidOk && urlDevice !== existingId &&
            (!existingId || confirm("Link this device to an existing Superhuman90 account?\n\nThis replaces the data currently on this device with the linked account's cloud data."))) {
          if (existingId) clearAllSh90Data();
          localStorage.setItem("sh90_device_id", urlDevice);
          window.history.replaceState({}, "", window.location.pathname);
          return urlDevice;
        }
        window.history.replaceState({}, "", window.location.pathname);
        if (existingId) return existingId;
      }
      let id = localStorage.getItem("sh90_device_id");
      // Auto-reassign: no ID yet, or stuck with old shared default with no local profile
      // Clear ALL sh90_ data so cloud-restored keys from the old shared ID don't persist
      if (!id || (id === OLD_DEFAULT_DEVICE && !localStorage.getItem("sh90_profile"))) {
        clearAllSh90Data();
        id = crypto.randomUUID();
        localStorage.setItem("sh90_device_id", id);
      }
      return id;
    };
    const DEVICE_ID = getDeviceId();

    // ── Anonymous auth + device claim ──
    // Each device signs in anonymously once (session persists in localStorage) and
    // claims its device_id server-side: sh90_claim_device() stamps user_id = auth.uid()
    // on this device's rows, and RLS restricts every table to user_id = auth.uid().
    // The device_id is the durable identity anchor: if the auth session is ever lost,
    // a fresh anonymous user re-claims the same device_id and nothing is orphaned.
    let _deviceAuthP = null;
    const ensureDeviceAuth = () => {
      if (!supabase) return Promise.resolve(false);
      if (!_deviceAuthP) {
        _deviceAuthP = (async () => {
          try {
            let session = (await supabase.auth.getSession()).data.session;
            if (!session) {
              const { data, error } = await supabase.auth.signInAnonymously();
              if (error) throw error;
              session = data.session;
            }
            const { error } = await supabase.rpc("sh90_claim_device", { p_device_id: DEVICE_ID });
            if (error) throw error;
            return true;
          } catch (e) {
            console.warn("SH90: device auth failed (will retry):", (e && e.message) || e);
            _deviceAuthP = null; // allow retry on the next sync attempt
            return false;
          }
        })();
      }
      return _deviceAuthP;
    };
    ensureDeviceAuth();

    // Re-claim on resume: if two devices share a device_id (?device= link flow),
    // ownership follows whichever device is active
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState !== "visible") return;
      var alreadyAuthed = !!_deviceAuthP;
      ensureDeviceAuth().then(function(ok) {
        if (ok && alreadyAuthed) {
          supabase.rpc("sh90_claim_device", { p_device_id: DEVICE_ID }).then(function(res) {
            if (res && res.error) console.warn("SH90: device re-claim failed:", res.error.message);
          });
        }
      });
    });

    // ── Supabase Sync Helpers ──
    const syncToSupabase = async (table, data, conflictCols) => {
      if (!supabase || !(await ensureDeviceAuth())) return;
      try {
        // supabase-js v2 returns {error} instead of throwing — check it or failures are invisible
        const { error } = await supabase.from(table).upsert(data, { onConflict: conflictCols });
        if (error) console.warn("SH90: sync failed for " + table + ":", error.message || error);
      } catch (e) { console.warn("Sync failed for " + table + ":", e); }
    };

    // Delete cloud rows when local data is removed — otherwise a future restore resurrects them
    const deleteFromSupabase = async (table, match) => {
      if (!supabase || !(await ensureDeviceAuth())) return;
      try {
        const { error } = await supabase.from(table).delete().match({ device_id: DEVICE_ID, ...match });
        if (error) console.warn("SH90: delete failed for " + table + ":", error.message || error);
      } catch (e) { console.warn("Delete failed for " + table + ":", e); }
    };

    const loadFromSupabase = async (table, filters) => {
      if (!supabase || !(await ensureDeviceAuth())) return null;
      try {
        // Page through results — PostgREST silently caps un-ranged selects at 1000 rows,
        // and a full program's exercise_logs exceeds that. Stable order is required or
        // pages can overlap/skip; any page error aborts (partial data must not restore).
        const PAGE = 1000;
        let all = [];
        for (let from = 0; ; from += PAGE) {
          let q = supabase.from(table).select("*").eq("device_id", DEVICE_ID).order("id").range(from, from + PAGE - 1);
          if (filters) Object.entries(filters).forEach(([k, v]) => { q = q.eq(k, v); });
          const { data, error } = await q;
          if (error) { console.warn("SH90: load failed for " + table + ":", error.message); return null; }
          if (!data || data.length === 0) break;
          all = all.concat(data);
          if (data.length < PAGE) break;
        }
        return all.filter(r => r.device_id === DEVICE_ID);
      } catch (e) {
        console.warn("Load failed for " + table + ":", e);
        return null;
      }
    };
    // Sync profile to Supabase
    const syncProfile = async (profileData, opts) => {
      if (!supabase || !(await ensureDeviceAuth())) return;
      var row = {
        device_id: DEVICE_ID,
        name: profileData.name || "",
        age: profileData.age || "",
        height: profileData.height || "",
        goal_weight: profileData.goalWeight || "",
        notes: profileData.notes || "",
        updated_at: new Date().toISOString(),
      };
      if (opts) {
        if (opts.theme !== undefined) row.theme = opts.theme;
        if (opts.textSize !== undefined) row.text_size = opts.textSize;
        if (opts.workoutMode !== undefined) row.workout_mode = opts.workoutMode;
        if (opts.calorieGoal !== undefined) row.calorie_goal = opts.calorieGoal;
        if (opts.nextWorkoutWeek !== undefined) row.next_workout_week = opts.nextWorkoutWeek;
        if (opts.nextWorkoutDay !== undefined) row.next_workout_day = opts.nextWorkoutDay;
        if (opts.rounds !== undefined) row.rounds = JSON.stringify(opts.rounds);
      }
      try {
        const { error } = await supabase.from("profiles").upsert(row, { onConflict: "device_id" });
        if (error) {
          // Older deployments lack the rounds column — retry without it
          if (row.rounds !== undefined && String(error.message || "").toLowerCase().includes("rounds")) {
            const { rounds, ...rowBase } = row;
            const retry = await supabase.from("profiles").upsert(rowBase, { onConflict: "device_id" });
            if (retry.error) console.warn("SH90: profile sync failed:", retry.error.message);
          } else {
            console.warn("SH90: profile sync failed:", error.message || error);
          }
        }
      } catch (e) { console.warn("SH90: profile sync failed:", e); }
    };

    // Report an API/app error to Supabase so failures can be diagnosed
    // remotely (the nightly agent reads these via sh90_agent_errors) —
    // the user should never have to describe an error message to anyone.
    const reportAppError = async (area, message, detail) => {
      try {
        if (!supabase || !(await ensureDeviceAuth())) return;
        await supabase.from("app_errors").insert({
          device_id: DEVICE_ID,
          version: typeof APP_VERSION !== "undefined" ? APP_VERSION : "?",
          area: area,
          message: String(message || "").slice(0, 500),
          detail: detail || null,
        });
      } catch (e) { /* telemetry must never break the app */ }
    };

    // Sync exercise log entry
    const syncExerciseLog = async (date, exerciseName, setIndex, entry) => {
      if (!supabase) return;
      syncToSupabase("exercise_logs", {
        device_id: DEVICE_ID,
        date: date,
        exercise_name: exerciseName,
        set_index: setIndex,
        weight: entry.weight || null,
        reps: entry.reps || null,
        done: !!entry.done,
        completed_at: entry.done ? new Date().toISOString() : null,
        updated_at: new Date().toISOString(),
      }, "device_id,date,exercise_name,set_index");
    };

    // Sync session
    const syncSession = async (date, session) => {
      if (!supabase || !(await ensureDeviceAuth())) return;
      const row = {
        device_id: DEVICE_ID,
        date: date,
        week: session.week ?? 1,
        day: session.day || 1,
        status: session.status || "active",
        routine: session.routine || "sh90",
        label: session.label || null,
        started_at: session.startedAt || null,
        completed_at: session.completedAt || null,
        updated_at: new Date().toISOString(),
      };
      try {
        const { error } = await supabase.from("sessions").upsert(row, { onConflict: "device_id,date" });
        if (error) {
          // Older deployments lack routine/label columns — retry without rather than losing the session
          const msg = String(error.message || "").toLowerCase();
          if (msg.includes("routine") || msg.includes("label")) {
            const { routine, label, ...rowBase } = row;
            const retry = await supabase.from("sessions").upsert(rowBase, { onConflict: "device_id,date" });
            if (retry.error) console.warn("SH90: session sync failed:", retry.error.message);
          } else {
            console.warn("SH90: session sync failed:", error.message || error);
          }
        }
      } catch (e) { console.warn("SH90: session sync failed:", e); }
    };

    // Sync weight
    const syncWeight = async (date, weight) => {
      if (!supabase) return;
      syncToSupabase("weight_log", {
        device_id: DEVICE_ID,
        date: date,
        weight: weight,
      }, "device_id,date");
    };

    // Sync habits
    const syncHabits = async (date, habits) => {
      if (!supabase) return;
      var row = { device_id: DEVICE_ID, date: date, updated_at: new Date().toISOString() };
      for (var i = 0; i < 8; i++) { row["h" + i] = !!(habits && habits[i]); }
      syncToSupabase("habit_log", row, "device_id,date");
    };

    // Sync habit note
    const syncHabitNote = async (date, habitIndex, note) => {
      if (!supabase) return;
      syncToSupabase("habit_notes", {
        device_id: DEVICE_ID,
        date: date,
        habit_index: habitIndex,
        note: note || "",
        updated_at: new Date().toISOString(),
      }, "device_id,date,habit_index");
    };

    // Sync steps
    const syncSteps = async (date, steps) => {
      if (!supabase) return;
      syncToSupabase("step_log", {
        device_id: DEVICE_ID,
        date: date,
        steps: steps,
      }, "device_id,date");
    };

    // Sync food entry
    const syncFoodEntry = async (entry, date) => {
      if (!supabase || !(await ensureDeviceAuth())) return;
      const row = {
        device_id: DEVICE_ID,
        date: date,
        entry_id: entry.id,
        food_text: entry.text || "",
        category: entry.category || "",
        logged_at: entry.time || null,
        items: JSON.stringify(entry.items || []),
        calories: entry.cal || 0,
        protein: entry.protein || 0,
        carbs: entry.carbs || 0,
        fat: entry.fat || 0,
      };
      try {
        const { error } = await supabase.from("food_entries").upsert(row, { onConflict: "device_id,entry_id" });
        if (error) {
          // Older deployments lack the category column (PGRST204) — retry without it rather than losing the entry
          if (String(error.message || "").toLowerCase().includes("category")) {
            const { category, ...rowNoCat } = row;
            const retry = await supabase.from("food_entries").upsert(rowNoCat, { onConflict: "device_id,entry_id" });
            if (retry.error) console.warn("SH90: food sync failed:", retry.error.message);
          } else {
            console.warn("SH90: food sync failed:", error.message || error);
          }
        }
      } catch (e) { console.warn("SH90: food sync failed:", e); }
    };

    // Sync exercise swap
    const syncExerciseSwap = async (week, day, original, swapped) => {
      if (!supabase) return;
      syncToSupabase("exercise_swaps", {
        device_id: DEVICE_ID,
        week: week,
        day: day,
        original_exercise: original,
        swapped_exercise: swapped,
      }, "device_id,week,day,original_exercise");
    };

    // Sync workout selection
    const syncWorkoutSelection = async (date, sel) => {
      if (!supabase) return;
      syncToSupabase("workout_selection", {
        device_id: DEVICE_ID,
        date: date,
        day: sel.day,
        label: sel.label,
      }, "device_id,date");
    };

    // ── Full Migration: push all localStorage data to Supabase ──
    const migrateToSupabase = async () => {
      if (!supabase) return;
      // Local flag, not devices-row existence: the startup claim races this check,
      // and its devices-row insert landing first would permanently skip migration
      if (localStorage.getItem("sh90_migrated")) return;
      if (!(await ensureDeviceAuth())) return; // no flag set — retried next launch
      try {
        // Check if device already exists
        var existing = await supabase.from("devices").select("device_id").eq("device_id", DEVICE_ID).single();
        if (existing.data) {
          console.log("SH90: Device already registered, skipping migration");
          localStorage.setItem("sh90_migrated", "1");
          return;
        }
      } catch (e) { /* device not found, proceed with migration */ }

      console.log("SH90: Migrating localStorage to Supabase...");

      // Migrate profile
      var profile = loadProfile();
      var theme = loadState("theme", "arctic");
      var textSize = loadState("textSize", "medium");
      var workoutMode = loadState("workoutMode", "gym");
      var calorieGoal = loadState("calorieGoal", 2000);
      var nextPos = loadState("nextWorkoutPos", null);
      syncProfile(profile, {
        theme: theme,
        textSize: textSize,
        workoutMode: workoutMode,
        calorieGoal: calorieGoal,
        nextWorkoutWeek: nextPos ? nextPos.week : 1,
        nextWorkoutDay: nextPos ? nextPos.day : 1,
      });

      // Migrate sessions
      var sessionLog = loadState("sessionLog", {});
      Object.entries(sessionLog).forEach(function(entry) {
        syncSession(entry[0], entry[1]);
      });

      // Migrate weight log
      var weightLog = loadState("weightLog", {});
      Object.entries(weightLog).forEach(function(entry) {
        if (entry[1] > 0) syncWeight(entry[0], entry[1]);
      });

      // Migrate habit log
      var habitLog = loadState("habitLog", {});
      Object.entries(habitLog).forEach(function(entry) {
        syncHabits(entry[0], entry[1]);
      });

      // Migrate habit notes
      var habitNotes = loadState("habitNotes", {});
      Object.entries(habitNotes).forEach(function(entry) {
        var date = entry[0];
        Object.entries(entry[1]).forEach(function(noteEntry) {
          syncHabitNote(date, parseInt(noteEntry[0]), noteEntry[1]);
        });
      });

      // Migrate step log
      var stepLog = loadState("stepLog", {});
      Object.entries(stepLog).forEach(function(entry) {
        syncSteps(entry[0], entry[1]);
      });

      // Migrate food log
      var foodLog = loadState("foodLog", {});
      Object.entries(foodLog).forEach(function(entry) {
        var date = entry[0];
        var dayLog = entry[1];
        if (dayLog && dayLog.entries) {
          dayLog.entries.forEach(function(foodEntry) {
            syncFoodEntry(foodEntry, date);
          });
        }
      });

      // Migrate exercise logs
      var logData = loadState("logData", {});
      Object.entries(logData).forEach(function(entry) {
        var parts = entry[0].split("-");
        if (parts.length >= 5) {
          var date = parts.slice(0, 3).join("-");
          var exName = parts.slice(3, -1).join("-");
          var setIdx = parseInt(parts[parts.length - 1]);
          syncExerciseLog(date, exName, setIdx, entry[1]);
        }
      });

      // Migrate swapped exercises
      var swapped = loadState("swappedExercises", {});
      Object.entries(swapped).forEach(function(entry) {
        var keyParts = entry[0].split("-");
        if (keyParts.length >= 3) {
          var w = parseInt(keyParts[0]);
          if (isNaN(w)) {
            // weekday-routine key: "<routine>-<day>-<Exercise Name>"
            syncExerciseSwap(0, parseInt(keyParts[1]), keyParts[0] + ":" + keyParts.slice(2).join("-"), entry[1]);
          } else {
            syncExerciseSwap(w, parseInt(keyParts[1]), keyParts.slice(2).join("-"), entry[1]);
          }
        }
      });

      // Migrate workout selections
      var ws = loadState("workoutSelection", {});
      Object.entries(ws).forEach(function(entry) {
        if (entry[1] && entry[1].day && entry[1].label) {
          syncWorkoutSelection(entry[0], entry[1]);
        }
      });

      console.log("SH90: Migration complete!");
      localStorage.setItem("sh90_migrated", "1");
    };
    migrateToSupabase();

    // ── Restore from Supabase (cloud → localStorage) ──
    // Called on startup. If Supabase has data, it overwrites empty localStorage.
    const restoreFromCloud = async () => {
      if (!supabase) return null;
      try {
        // Check if Supabase has data for this device
        const profileRows = await loadFromSupabase("profiles");
        if (profileRows === null) return null;                 // load failed — retry next launch
        if (profileRows.length === 0) return { empty: true };   // cloud confirmed empty for this device
        const p = profileRows[0];
        const restored = {};

        // Profile
        restored.profile = {
          name: p.name || "", age: p.age || "", height: p.height || "",
          goalWeight: p.goal_weight || "", notes: p.notes || "",
        };
        restored.theme = p.theme || "arctic";
        restored.textSize = p.text_size || "medium";
        restored.workoutMode = p.workout_mode || "gym";
        restored.calorieGoal = p.calorie_goal || 2000;
        if (p.next_workout_week && p.next_workout_day) {
          restored.nextWorkoutPos = { week: p.next_workout_week, day: p.next_workout_day };
        }
        if (p.rounds) {
          try { restored.rounds = typeof p.rounds === "string" ? JSON.parse(p.rounds) : p.rounds; } catch (e) {}
        }

        // Sessions: rows → { "2026-02-18": { week, day, status, completedAt } }
        const sessionRows = await loadFromSupabase("sessions");
        if (sessionRows && sessionRows.length > 0) {
          const sessionLog = {};
          sessionRows.forEach(function(r) {
            sessionLog[r.date] = {
              week: r.week, day: r.day, status: r.status,
              routine: r.routine || "sh90", label: r.label || undefined,
              startedAt: r.started_at, completedAt: r.completed_at,
            };
          });
          restored.sessionLog = sessionLog;
        }

        // Weight log: rows → { "2026-02-18": 185.5 }
        const weightRows = await loadFromSupabase("weight_log");
        if (weightRows && weightRows.length > 0) {
          const weightLog = {};
          weightRows.forEach(function(r) { weightLog[r.date] = Number(r.weight); });
          restored.weightLog = weightLog;
        }

        // Habit log: rows → { "2026-02-18": [true, false, ...] }
        const habitRows = await loadFromSupabase("habit_log");
        if (habitRows && habitRows.length > 0) {
          const habitLog = {};
          habitRows.forEach(function(r) {
            habitLog[r.date] = [r.h0, r.h1, r.h2, r.h3, r.h4, r.h5, r.h6, r.h7];
          });
          restored.habitLog = habitLog;
        }

        // Habit notes: rows → { "2026-02-18": { 0: "note", 2: "note" } }
        const noteRows = await loadFromSupabase("habit_notes");
        if (noteRows && noteRows.length > 0) {
          const habitNotes = {};
          noteRows.forEach(function(r) {
            if (!habitNotes[r.date]) habitNotes[r.date] = {};
            habitNotes[r.date][r.habit_index] = r.note;
          });
          restored.habitNotes = habitNotes;
        }

        // Step log: rows → { "2026-02-18": 8500 }
        const stepRows = await loadFromSupabase("step_log");
        if (stepRows && stepRows.length > 0) {
          const stepLog = {};
          stepRows.forEach(function(r) { stepLog[r.date] = r.steps; });
          restored.stepLog = stepLog;
        }

        // Exercise logs: rows → { "2026-02-18-Squat-0": { weight, reps, done } }
        const exRows = await loadFromSupabase("exercise_logs");
        if (exRows && exRows.length > 0) {
          const logData = {};
          exRows.forEach(function(r) {
            var key = r.date + "-" + r.exercise_name + "-" + r.set_index;
            logData[key] = { weight: r.weight || "", reps: r.reps || "", done: !!r.done };
          });
          restored.logData = logData;
        }

        // Swapped exercises: rows → { "5-3-Squat": "Leg Press" }
        const swapRows = await loadFromSupabase("exercise_swaps");
        if (swapRows && swapRows.length > 0) {
          const swapped = {};
          swapRows.forEach(function(r) {
            // week 0 = weekday-routine swap, routine encoded as "routine:Exercise"
            if (r.week === 0 && r.original_exercise.indexOf(":") > 0) {
              var colon = r.original_exercise.indexOf(":");
              var rk = r.original_exercise.slice(0, colon);
              var exName = r.original_exercise.slice(colon + 1);
              swapped[rk + "-" + r.day + "-" + exName] = r.swapped_exercise;
            } else {
              swapped[r.week + "-" + r.day + "-" + r.original_exercise] = r.swapped_exercise;
            }
          });
          restored.swappedExercises = swapped;
        }

        // Workout selection: rows → { "2026-02-18": { day: 3, label: "ARM A" } }
        const wsRows = await loadFromSupabase("workout_selection");
        if (wsRows && wsRows.length > 0) {
          const ws = {};
          wsRows.forEach(function(r) {
            ws[r.date] = { day: r.day, label: r.label };
          });
          restored.workoutSelection = ws;
        }

        // Food log: rows → { "2026-02-18": { entries: [...] } }
        const foodRows = await loadFromSupabase("food_entries");
        if (foodRows && foodRows.length > 0) {
          const foodLog = {};
          foodRows.forEach(function(r) {
            if (!foodLog[r.date]) foodLog[r.date] = { entries: [] };
            foodLog[r.date].entries.push({
              id: r.entry_id, text: r.food_text, time: r.logged_at,
              category: r.category || "",
              items: typeof r.items === "string" ? JSON.parse(r.items) : (r.items || []),
              cal: r.calories || 0, protein: r.protein || 0,
              carbs: r.carbs || 0, fat: r.fat || 0,
            });
          });
          restored.foodLog = foodLog;
        }

        // Save all restored data to localStorage
        if (restored.profile) saveState("profile", restored.profile);
        if (restored.theme) saveState("theme", restored.theme);
        if (restored.textSize) saveState("textSize", restored.textSize);
        if (restored.workoutMode) saveState("workoutMode", restored.workoutMode);
        if (restored.calorieGoal) saveState("calorieGoal", restored.calorieGoal);
        if (restored.nextWorkoutPos) saveState("nextWorkoutPos", restored.nextWorkoutPos);
        if (restored.sessionLog) saveState("sessionLog", restored.sessionLog);
        if (restored.weightLog) saveState("weightLog", restored.weightLog);
        if (restored.habitLog) saveState("habitLog", restored.habitLog);
        if (restored.habitNotes) saveState("habitNotes", restored.habitNotes);
        if (restored.stepLog) saveState("stepLog", restored.stepLog);
        if (restored.logData) saveState("logData", restored.logData);
        if (restored.swappedExercises) saveState("swappedExercises", restored.swappedExercises);
        if (restored.workoutSelection) saveState("workoutSelection", restored.workoutSelection);
        if (restored.foodLog) saveState("foodLog", restored.foodLog);
        if (restored.rounds && restored.rounds.current) saveState("rounds", restored.rounds);

        localStorage.setItem("sh90_restore_done", "1");
        window.__sh90_didCloudRestore = true;
        console.log("SH90: Restored from cloud");
        return restored;
      } catch (e) {
        console.warn("SH90: Cloud restore failed:", e);
        return null;
      }
    };

    // Expose globally so React component can call it
    window.__sh90_restoreFromCloud = restoreFromCloud;

    // ── BLOCK rendering until cloud restore is done ──
    // This ensures loadState() in useState initializers sees cloud data
    window.__sh90_ready = false;
    (async function() {
      try {
        // Backfill the restore-done flag for established devices with real data
        // (before this flag existed, presence of sh90_profile gated restore — but a
        // failed first restore also wrote sh90_profile, permanently disabling retry)
        if (!localStorage.getItem("sh90_restore_done")) {
          try {
            var _sl = JSON.parse(localStorage.getItem("sh90_sessionLog") || "{}");
            var _hl = JSON.parse(localStorage.getItem("sh90_habitLog") || "{}");
            var _pf = JSON.parse(localStorage.getItem("sh90_profile") || "{}");
            if (Object.keys(_sl).length > 0 || Object.keys(_hl).length > 0 || (_pf && _pf.name)) {
              localStorage.setItem("sh90_restore_done", "1");
            }
          } catch (e2) {}
        }
        // Restore until it either succeeds or the cloud confirms it has nothing —
        // a transient failure (offline first launch) retries on the next launch
        if (!localStorage.getItem("sh90_restore_done")) {
          var data = await restoreFromCloud();
          if (data && data.empty) localStorage.setItem("sh90_restore_done", "1");
        }
      } catch(e) { console.warn("SH90: Pre-render restore error:", e); }
      window.__sh90_ready = true;
      // Now render the app
      if (window.__sh90_renderApp) window.__sh90_renderApp();
    })();

// ── Gemini with model fallback ──
// Google retires model ids without much warning (gemini-2.5-flash started
// 404ing in Aug 2026 and broke food tracking). Try the newest first, walk
// down the chain on model-not-found, remember what worked.
const GEMINI_MODELS = ["gemini-3.6-flash", "gemini-3.5-flash-lite", "gemini-flash-latest", "gemini-2.5-flash"];
async function geminiGenerate(apiKey, body) {
  const cached = localStorage.getItem("sh90_geminiModel");
  const chain = cached ? [cached, ...GEMINI_MODELS.filter(m => m !== cached)] : GEMINI_MODELS;
  let lastErr = null;
  const attemptLog = []; // {model, status, err} per request — attached to thrown errors for telemetry
  const fail = (msg) => { const e = new Error(msg); e.attempts = attemptLog; return e; };
  for (const model of chain) {
    // Config fields drift across model generations (Gemini 3 rejects the
    // thinkingBudget field Gemini 2.5 needed) — try the body as given, then
    // once more without thinkingConfig. The stripped attempt raises
    // maxOutputTokens because these models spend output budget thinking.
    const attempts = [body];
    if (body.generationConfig && body.generationConfig.thinkingConfig) {
      const gc = { ...body.generationConfig };
      delete gc.thinkingConfig;
      gc.maxOutputTokens = Math.max(gc.maxOutputTokens || 0, 4096);
      const stripped = { ...body, generationConfig: gc };
      // Remember which request shape worked last time so the common case
      // is one request, not a known-failing one plus a retry
      if (localStorage.getItem("sh90_geminiStrip") === "1") attempts.unshift(stripped);
      else attempts.push(stripped);
    }
    for (const attempt of attempts) {
      let res;
      try {
        res = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(apiKey),
          { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(attempt) }
        );
      } catch (e) {
        attemptLog.push({ model: model, status: 0, err: String(e && e.message || e).slice(0, 120) });
        throw fail("Network error — check your connection");
      }
      if (res.ok) {
        const result = await res.json();
        let text = "";
        if (result.candidates && result.candidates[0] && result.candidates[0].content) {
          (result.candidates[0].content.parts || []).forEach(function(p) { if (p.text && !p.thought) text += p.text; });
        }
        if (text) {
          localStorage.setItem("sh90_geminiModel", model);
          localStorage.setItem("sh90_geminiStrip", attempt === body ? "0" : "1");
          return { text: text, result: result, model: model };
        }
        // 200 with no usable text (thinking ate the token budget, safety
        // block, …) — treat like a failed attempt and keep walking
        const why = (result.candidates && result.candidates[0] && result.candidates[0].finishReason)
          || (result.promptFeedback && result.promptFeedback.blockReason) || "no text";
        attemptLog.push({ model: model, status: 200, err: "empty response (" + why + ")" });
        lastErr = "[" + model + "] returned no text (" + why + ")";
        continue;
      }
      const errBody = await res.text();
      attemptLog.push({ model: model, status: res.status, err: errBody.slice(0, 200) });
      // A key problem fails identically on every model — surface it now
      if (res.status === 401 || res.status === 403 || /api key not valid|api_key_invalid|key expired/i.test(errBody)) {
        throw fail("Gemini API key rejected (" + res.status + "). Check the key in Me → Food Tracker.");
      }
      lastErr = "[" + model + "] " + res.status + ": " + errBody.slice(0, 200);
    }
    // Any other failure (retired model, config mismatch, per-model quota) →
    // walk down the chain rather than giving up
  }
  throw fail(lastErr || "No Gemini model available");
}

// ── Mini Chart Component ──
let _chartId = 0;
function MiniChart({ data, color, height = 60, label }) {
  const [gradId] = useState(() => `grad-${++_chartId}`);
  if (!data || data.length < 2) return null;
  const validData = data.filter(d => d !== null && d !== undefined);
  if (validData.length < 2) return null;
  const min = Math.min(...validData) - 1;
  const max = Math.max(...validData) + 1;
  const range = max - min || 1;
  const w = 100;
  const points = validData.map((v, i) => {
    const x = (i / (validData.length - 1)) * w;
    const y = height - ((v - min) / range) * (height - 10) - 5;
    return `${x},${y}`;
  }).join(" ");
  const areaPoints = points + ` ${w},${height} 0,${height}`;
  return (
    <div style={{ position: "relative" }}>
      {label && <div style={{ fontSize: fs(10), opacity: 0.5, marginBottom: 4 }}>{label}</div>}
      <svg viewBox={`0 0 ${w} ${height}`} style={{ width: "100%", height }}>
        <defs>
          <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.3" />
            <stop offset="100%" stopColor={color} stopOpacity="0" />
          </linearGradient>
        </defs>
        <polygon points={areaPoints} fill={`url(#${gradId})`} />
        <polyline points={points} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: fs(10), opacity: 0.4, marginTop: 2 }}>
        <span>{validData[0]}</span>
        <span>{validData[validData.length - 1]}</span>
      </div>
    </div>
  );
}

      const needsRepair = preEpoch.length >= 2 || prev.startDate < CYCLE_EPOCH;

      const completedDates = Object.entries(sessionLog)
        .filter(([date, s]) => s.status === "completed" && date < CYCLE_EPOCH)
        .map(([date]) => date).sort();
      const postEpoch = prev.history.filter(h => h.endDate >= CYCLE_EPOCH);
      const history = [];
      if (completedDates.length > 0 || preEpoch.length > 0) {
        history.push({
          round: 1,
          startDate: completedDates[0] || (preEpoch[0] && preEpoch[0].startDate) || CYCLE_EPOCH,
          endDate: completedDates[completedDates.length - 1] || CYCLE_EPOCH,
          workoutsCompleted: completedDates.length ||
            preEpoch.reduce((s, h) => s + (h.workoutsCompleted || 0), 0),
        });
      }
      postEpoch.forEach(h => history.push({ ...h, round: history.length + 1 }));
      return {
        ...prev,
        current: history.length + 1,
        startDate: prev.startDate < CYCLE_EPOCH ? CYCLE_EPOCH : prev.startDate,
        history,
      };
    });
  }, []);

  // Maintenance ("heavy call") pauses the cycle clock: every elapsed day while
  // it's on pushes startDate forward one day, so the build resumes exactly
  // where it stopped. Logging continues normally throughout.
  useEffect(() => {
    if (!rounds.maintenance) return;
    const since = rounds.maintenance.since;
    if (since >= todayStr) return;
    const shift = Math.round((new Date(todayStr + "T12:00:00") - new Date(since + "T12:00:00")) / 86400000);
    setRounds(prev => {
      if (!prev.maintenance) return prev;
      const d = new Date(prev.startDate + "T12:00:00");
      d.setDate(d.getDate() + shift);
      return { ...prev, startDate: toLocalDateStr(d), maintenance: { since: todayStr } };
    });
  }, [todayStr, rounds.maintenance]);

  const roundStartObj = new Date(rounds.startDate + "T12:00:00");
  const programDay = Math.floor((selectedDateObj - roundStartObj) / (1000 * 60 * 60 * 24)) + 1;
  // Sessions completed in the current cycle (any routine)
  const roundCompletedCount = Object.entries(sessionLog)
    .filter(([date, s]) => s.status === "completed" && date >= rounds.startDate).length;

  // Phase + weekly prescription for a given cycle day
  const getRoundPhase = (d) => {
    if (maintenanceOn) return {
      key: "maintenance", label: "MAINTENANCE · HEAVY CALL",
      tip: "~1/3 volume, keep loads heavy, 2 sessions/week holds everything (35+ needs ~1/3, not 1/9 — Bickel). Cardio continues. Cycle clock is paused.",
    };
    if (d > cycleBuildWeeks * 7) return {
      key: "deescalation", label: "DE-ESCALATION WEEK",
      tip: "60-70% of working loads · half the sets · dissipate fatigue, don't detrain. Block boundary: record est. 1RM on 2-3 key lifts + grip strength. Next cycle rebuilds from ~10 sets, loads a notch higher.",
    };
    const wk = Math.max(1, Math.ceil(d / 7));
    const f = wk / cycleBuildWeeks; // 0..1 through the build
    const setsTarget = Math.round(10 + 8 * ((wk - 1) / Math.max(1, cycleBuildWeeks - 1)));
    const rir = f <= 0.34 ? "3 RIR" : f <= 0.67 ? "1-2 RIR" : "0-1 RIR";
    return {
      key: "build", label: `BUILD · WEEK ${wk} OF ${cycleBuildWeeks}`, week: wk, frac: f,
      tip: wk === 1
        ? `Start low: ~10 hard sets/muscle at 3 RIR. Deliberately easy — you're not proving anything in week 1.`
        : wk >= cycleBuildWeeks
          ? `Peak week: ~${setsTarget}-20 sets/muscle at 0-1 RIR. Should feel genuinely hard and slightly unsustainable — that's the top of the block.`
          : `Target ~${setsTarget} sets/muscle this week at ${rir}. Add ~1 set/muscle/week, shave RIR as you go.`,
    };
  };
  const roundPhase = getRoundPhase(programDay);
  // Volume-adjusted rendering applies to weekday lifting routines only —
  // SH90 has its own built-in week-12 deload, and yoga has nothing to scale.
  const phaseReduced = !!ROUTINES[routine]?.weekday && programDay > 0 &&
    (roundPhase.key !== "build" || (roundPhase.week || 9) <= Math.ceil(cycleBuildWeeks / 3));

  // Auto-rollover: at the end of the de-escalation the app starts the next
  // cycle itself — rebuild. Cycles tile the calendar in exact windows; windows
  // with zero workouts slide by without consuming a cycle number. Paused while
  // maintenance mode is on.
  useEffect(() => {
    if (routine === "sh90" || rounds.maintenance) return; // SH90 keeps its manual trophy flow
    if (rounds.startDate < CYCLE_EPOCH) return; // pre-cycle history is the repair effect's job, never the tiler's
    const len = ((rounds.buildWeeks || 6) + 1) * 7;
    const daysIn = Math.floor((new Date(todayStr + "T12:00:00") - new Date(rounds.startDate + "T12:00:00")) / 86400000) + 1;
    if (daysIn <= len) return;
    setRounds(prev => {
      let start = prev.startDate;
      let current = prev.current;
      const history = [...prev.history];
      const dayCount = (ds) => Math.floor((new Date(todayStr + "T12:00:00") - new Date(ds + "T12:00:00")) / 86400000) + 1;
      while (dayCount(start) > len) {
        const end = (() => { const d = new Date(start + "T12:00:00"); d.setDate(d.getDate() + len - 1); return toLocalDateStr(d); })();
        const next = (() => { const d = new Date(start + "T12:00:00"); d.setDate(d.getDate() + len); return toLocalDateStr(d); })();
        const done = Object.entries(sessionLog).filter(([date, s]) => s.status === "completed" && date >= start && date <= end).length;
        if (done > 0) {
          history.push({ round: current, startDate: start, endDate: end, workoutsCompleted: done, emphasis: prev.emphasis || "hypertrophy" });

        }

      }
      return { ...prev, current, startDate: start, history };
    });
  }, [todayStr, routine, rounds.buildWeeks, rounds.maintenance]);

  const t = THEMES[theme];
  const weekData = routine === "sh90" ? (WORKOUT_DATA[week] || WORKOUT_DATA[5]) : null;
  // A logged session always dictates what its date shows, even if the active
  // routine has since changed — the exercise list must match the status banner
  const _selSess = sessionLog[selectedDate];
  const _selSessRoutine = _selSess ? (_selSess.routine || "sh90") : null;
  const crossRoutineSession = !!_selSess && _selSessRoutine !== routine;
  const dayDataRaw = crossRoutineSession
    ? getRoutineDayData(_selSessRoutine, _selSess.week, _selSess.day)
    : routine === "sh90" ? weekData?.[day] : getRoutineDayData(routine, week, day);
  // Render the day's sets scaled to the cycle phase:
  //   maintenance    → ~1/3 of sets (loads stay heavy)
  //   de-escalation  → half the sets at 60-70% load
  //   early build    → one set trimmed off the bigger exercises (start low)
  //   mid/late build → as written (peak week pushes RIR, not extra rendered sets)
  const scaleSets = (sets) => {
    if (roundPhase.key === "maintenance") return Math.max(1, Math.ceil(sets / 3));
    if (roundPhase.key === "deescalation") return Math.max(1, Math.round(sets / 2));
    return sets >= 3 ? sets - 1 : sets; // early build
  };
  const phaseTag = roundPhase.key === "maintenance" ? "MAINTENANCE"
    : roundPhase.key === "deescalation" ? "DE-ESCALATION"
    : "EASY START";
  const dayData = (phaseReduced && !crossRoutineSession && dayDataRaw && dayDataRaw.exercises.length > 0)
    ? {
        ...dayDataRaw,
        label: `${dayDataRaw.label} · ${phaseTag}`,
        desc: roundPhase.tip,
        exercises: dayDataRaw.exercises.map(ex => ({ ...ex, sets: scaleSets(ex.sets) })),
      }
    : dayDataRaw;
  const exercises = dayData?.exercises || [];
  const isRestDay = routine !== "sh90" && routine !== "yoga" && exercises.length === 0;
  const programWeek = nextWorkoutPos.week;
  const phaseLabel = programWeek <= 4 ? "Phase 1" : programWeek <= 8 ? "Phase 2" : "Phase 3";
  const phaseWeeks = programWeek <= 4 ? "Wk 1-4" : programWeek <= 8 ? "Wk 5-8" : "Wk 9-12";
  const headerSub = routine === "sh90"
    ? `${phaseLabel} · ${phaseWeeks} · Round ${rounds.current}`
    : maintenanceOn
      ? `${ROUTINES[routine].name} · Cycle ${rounds.current} · 🛡️ Maintenance`
      : `${ROUTINES[routine].name} · Cycle ${rounds.current}`;

  const getPrevWeekResult = (exName) => {
    const sorted = Object.entries(logData)
      .filter(([key]) => key.includes(`-${exName}-`) && !key.startsWith(selectedDate))
      .sort(([a], [b]) => b.localeCompare(a));
    if (sorted.length > 0) {
      const lastEntry = sorted[0][1];
      if (lastEntry.weight) return `${lastEntry.weight}×${lastEntry.reps || "?"}`;
    }
    // Spreadsheet seed results only apply to the SH90 program
    if (routine !== "sh90" || week <= 1) return null;
    const prev = WORKOUT_DATA[week - 1];
    if (!prev || !prev[day]) return null;
    const ex = prev[day].exercises.find(e => e.name === exName);
    return ex?.result || null;
  };

  const getExerciseHistory = (exName) => {
    const hist = [];
    const entries = Object.entries(logData)
      .filter(([key]) => key.includes(`-${exName}-`))
      .sort(([a], [b]) => a.localeCompare(b));
    const byDate = {};
    entries.forEach(([key, val]) => {
      const date = key.split("-").slice(0, 3).join("-");
      if (val.weight && !byDate[date]) {
        byDate[date] = { date, weight: val.weight, reps: val.reps };
        hist.push({ week: date, result: `${val.weight}×${val.reps || "?"}` });
      }
    });
    return hist;
  };

  const habitStreaks = HABIT_LABELS.map((_, idx) => {
    // Calculate streak backwards from selected date
    let streak = 0;
    const d = new Date(selectedDate + "T12:00:00");
    for (let i = 0; i < 90; i++) {
      const ds = toLocalDateStr(d);
      const dayLog = habitLog[ds];
      if (dayLog && dayLog[idx]) streak++;
      else if (i > 0) break;
      // i === 0 and not yet done: skip today without breaking — the streak
      // from yesterday holds until the day is actually over
      d.setDate(d.getDate() - 1);
    }
    return streak;
  });

  const habitRates = HABIT_LABELS.map((_, idx) => {
    const allDays = Object.values(habitLog);
    if (allDays.length === 0) return 0;
    const total = allDays.reduce((s, d) => s + (d[idx] ? 1 : 0), 0);
    return Math.round((total / allDays.length) * 100);
  });

  const totalCompletedToday = selectedHabits.filter(Boolean).length;
  const todayRate = Math.round(
    (selectedHabits.reduce((s, v, i) => s + (v ? HABIT_WEIGHTS[i] : 0), 0) / HABIT_WEIGHT_TOTAL) * 100
  );

  // Habit notes helpers
  const getNote = (idx) => habitNotes[selectedDate]?.[idx] || "";
  const setNote = (idx, text) => {
    setHabitNotes(prev => ({
      ...prev,
      [selectedDate]: { ...(prev[selectedDate] || {}), [idx]: text }
    }));
    syncHabitNote(selectedDate, idx, text);
  };

  // Food tracking helpers — uses Gemini AI for nutrition estimation
  const MEAL_CATEGORIES = ["Breakfast", "Lunch", "Snack", "Dinner"];
  const detectMealCategory = (text) => {
    var lower = text.toLowerCase().trim();
    var categories = [
      { key: "Breakfast", patterns: [/^breakfast\b[:\-,]?\s*/i] },
      { key: "Lunch", patterns: [/^lunch\b[:\-,]?\s*/i] },
      { key: "Dinner", patterns: [/^dinner\b[:\-,]?\s*/i, /^supper\b[:\-,]?\s*/i] },
      { key: "Snack", patterns: [/^snack\b[:\-,]?\s*/i, /^snacks\b[:\-,]?\s*/i] },
    ];
    for (var c of categories) {
      for (var p of c.patterns) {
        if (p.test(text)) return { category: c.key, cleanText: text.replace(p, "").trim() };
      }
    }
    // Fall back to time-based detection
    var hour = new Date().getHours();
    var cat = hour < 11 ? "Breakfast" : hour < 14 ? "Lunch" : hour < 17 ? "Snack" : "Dinner";
    return { category: cat, cleanText: text };
  };
  const estimateFood = async (text) => {
    setFoodLoading(true); setFoodError("");
    if (!calorieApiKey) { setFoodError("API key not set. Go to Settings to add your Gemini key."); setFoodLoading(false); return; }
    var detected = detectMealCategory(text);
    var foodText = detected.cleanText || text;
    try {
      var promptText = "You are a precise nutrition calculator. The user describes food they ate. " +
        "RULES: " +
        "1. EXACT amounts when given: '5 eggs' = 5 eggs, '2 slices' = 2 slices. " +
        "2. Fractions: 'quarter of an avocado' = 0.25 avocado, 'half a banana' = 0.5 banana. " +
        "3. Measurements: '1 cup rice' = 1 cup, '2 tbsp peanut butter' = 2 tbsp. " +
        "4. Words: 'a'/'an' = 1, 'a couple' = 2, 'a few' = 3, 'half' = 0.5. " +
        "5. ESTIMATION when vague: If the user says 'a bowl of', 'a plate of', 'some', or doesn't specify a quantity, " +
        "estimate a realistic typical serving. A bowl = ~2 cups. A plate = ~1.5 cups. A handful = ~1/4 cup. " +
        "A piece/slice = 1 standard piece. 'some' = a moderate portion. " +
        "6. MIXED items: 'bowl of watermelon and pineapple' = split roughly evenly (e.g. ~1 cup each). " +
        "List each food as a SEPARATE item with its own macros. " +
        "7. The serving field MUST show the estimated amount (e.g. '~1 cup', '~2 cups', '1/4 avocado'). " +
        "Return ONLY valid JSON, NO markdown, NO explanation. " +
        'Structure: {"items":[{"name":"food","cal":number,"protein":number,"carbs":number,"fat":number,"serving":"amount"}],"cal":total,"protein":total,"carbs":total,"fat":total}. ' +
        "User input: " + foodText;
      const gem = await geminiGenerate(calorieApiKey, {
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: { maxOutputTokens: 1024, thinkingConfig: { thinkingBudget: 0 } },
      });
      var responseText = gem.text;
      // Extract JSON from response (strip any markdown fences if present)
      var jsonMatch = responseText.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error("Could not parse nutrition data. Raw: " + responseText.slice(0, 200));
      var data;
      try { data = JSON.parse(jsonMatch[0]); } catch (pe) {
        throw new Error("JSON parse failed: " + pe.message + ". Text: " + jsonMatch[0].slice(0, 200));
      }
      if (!data.items || data.items.length === 0) { setFoodError("No results — try being more specific"); setFoodLoading(false); return; }
      var items = data.items.map(function(it) {
        return {
          name: it.name, cal: Math.round(it.cal || 0), protein: Math.round(it.protein || 0),
          carbs: Math.round(it.carbs || 0), fat: Math.round(it.fat || 0),
          serving: it.serving || "",
        };
      });
      var totals = items.reduce(function(s, i) { return { cal: s.cal + i.cal, protein: s.protein + i.protein, carbs: s.carbs + i.carbs, fat: s.fat + i.fat }; }, { cal: 0, protein: 0, carbs: 0, fat: 0 });
      setFoodPending({ text: foodText, category: detected.category, items: items, cal: totals.cal, protein: totals.protein, carbs: totals.carbs, fat: totals.fat, time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) });

    } catch (e) {
      setFoodError(e.message || "Failed to estimate");
