    }
    setFoodLoading(false);
  };
  const addFoodEntry = () => {
    if (!foodPending) return;
    var newEntry = { ...foodPending, id: Date.now() };
    setFoodLog(prev => {
      const dayLog = prev[selectedDate] || { entries: [] };
      return { ...prev, [selectedDate]: { entries: [...dayLog.entries, newEntry] } };
    });
    syncFoodEntry(newEntry, selectedDate);
    toggleHabit(5, true);
    setFoodPending(null); setFoodInput("");
  };
  const removeFoodEntry = (id) => {
    setFoodLog(prev => {
      const dayLog = prev[selectedDate];
      if (!dayLog) return prev;
      const entries = dayLog.entries.filter(e => e.id !== id);
      if (entries.length === 0) { toggleHabit(5, false); }
      return { ...prev, [selectedDate]: { entries } };
    });
    deleteFromSupabase("food_entries", { entry_id: id });
  };
  const startEditingFood = (entry) => {
    setFoodEditing({ id: entry.id, category: entry.category || "Snack", cal: entry.cal, protein: entry.protein, carbs: entry.carbs, fat: entry.fat });
  };
  const saveFoodEdit = () => {
    if (!foodEditing) return;
    setFoodLog(prev => {
      const dayLog = prev[selectedDate];
      if (!dayLog) return prev;
      const entries = dayLog.entries.map(e => e.id === foodEditing.id ? {
        ...e, category: foodEditing.category,
        cal: parseInt(foodEditing.cal) || 0, protein: parseInt(foodEditing.protein) || 0,
        carbs: parseInt(foodEditing.carbs) || 0, fat: parseInt(foodEditing.fat) || 0,
      } : e);
      const edited = entries.find(e => e.id === foodEditing.id);
      if (edited) syncFoodEntry(edited, selectedDate);
      return { ...prev, [selectedDate]: { entries } };
    });
    setFoodEditing(null);
  };
  const getDayFoodTotals = (date) => {
    const entries = foodLog[date]?.entries || [];
    return entries.reduce((s, e) => ({ cal: s.cal + e.cal, protein: s.protein + e.protein, carbs: s.carbs + e.carbs, fat: s.fat + e.fat }), { cal: 0, protein: 0, carbs: 0, fat: 0 });
  };
  const startListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setFoodError("Voice not supported in this browser"); return; }
    const recognition = new SR();
    recognition.lang = "en-US"; recognition.interimResults = false;
    recognition.onresult = (e) => { setFoodInput(e.results[0][0].transcript); setIsListening(false); };
    recognition.onerror = () => setIsListening(false);
    recognition.onend = () => setIsListening(false);
    setIsListening(true);
    recognition.start();
  };

  // ── AI Coach ──
  const buildCoachContext = () => {
    const recentSessions = Object.entries(sessionLog)
      .filter(([_, s]) => s.status === "completed")
      .sort(([a], [b]) => b.localeCompare(a))
      .slice(0, 7)
      .map(([date, s]) => {
        const sr = s.routine || "sh90";
        const lbl = sr === "yoga" ? (s.label || "Yoga") : (getRoutineDayData(sr, s.week, s.day)?.label || `Day ${s.day}`);
        return `${date}: ${lbl}${sr !== "sh90" ? ` (${ROUTINES[sr]?.name})` : ` (W${s.week}D${s.day})`}`;
      });
    const recentWeights = sortedWeights.slice(-14).map(e => `${e.date}: ${e.weight}`);
    const habitSummary = HABIT_LABELS.map((l, i) => `${l}: ${habitRates[i]}% (streak ${habitStreaks[i]}d)`).join(", ");
    const foodToday = getDayFoodTotals(todayStr);
    const todayData = getRoutineDayData(routine, week, day);
    return [
      `You are the in-app AI coach for Superhuman90, a 90-day fitness and habit app. Be concise, direct, encouraging, and practical — like a knowledgeable training partner. Use short paragraphs or tight bullet lists. No markdown headers.`,
      `User: ${profile.name || "athlete"}${profile.age ? `, age ${profile.age}` : ""}${profile.height ? `, ${profile.height}` : ""}${profile.goalWeight ? `, goal weight ${profile.goalWeight} lbs` : ""}.`,
      profile.notes ? `User goals/notes: ${profile.notes}` : "",
      `Current date: ${todayStr}. Round ${rounds.current} of the 90-day program, day ${programDay > 0 ? Math.min(programDay, 90) + (programDay > 90 ? "+ (round overdue)" : "") : "?"} of 90. ${rounds.history.length} prior round(s) completed.`,
      `Active routine: ${ROUTINES[routine].name}. ${routine === "sh90" ? `Position: Week ${week}, Day ${day} (${todayData?.label || ""}), ${phaseLabel}.` : `Today's scheduled workout: ${todayData?.label || "n/a"}.`}`,
      `Workouts completed this round: ${roundCompletedCount}.`,
      `Recent workouts: ${recentSessions.join("; ") || "none yet"}.`,
      `Weight log (last ${recentWeights.length}): ${recentWeights.join(", ") || "none"}. Current: ${currentWeight || "?"} lbs, start: ${startWeight || "?"} lbs.`,
      `Habit rates: ${habitSummary}.`,
      `Today's nutrition so far: ${foodToday.cal} cal, ${foodToday.protein}g protein (goal ${calorieGoal} cal).`,
      `Home recovery equipment available: HBOT chamber, red light panel, Neuronic photobiomodulation helmet, hydrogen inhalation, PowerPlate, free weights.`,
      `Training principles the user follows (from their Aug 2026 evidence review — align your advice with these): 10-20 hard sets per muscle per week, ~2x/week frequency, most sets at 0-3 reps in reserve (RIR anchoring, never fixed percentages), double progression, training organized in cycles of 6-8 build weeks + 1 de-escalation week which the app runs automatically (build ramps ~10 to 16-20 sets/muscle while RIR shaves 3 to 0-1; de-escalation halves volume at 60-70% load; next cycle auto-starts and rebuilds from low volume; maintenance mode = ~1/3 volume at heavy loads with the clock paused during heavy call), hip hinge + loaded carries + brief power work + rotator cuff work are non-negotiable patterns, 150+ min/week Zone 2 plus one weekly VO2max session (Norwegian 4x4), protein 1.6-2.2 g/kg/day in ~0.4 g/kg doses, creatine 5 g/day, 7-9 h sleep, two rest days. The Upper/Lower routine implements this; Full-Body 3x is the fallback for call-disrupted weeks.`,
      `The user may ask about training, recovery, habits, nutrition, or motivation. If asked for medical advice beyond general fitness, recommend consulting a professional. Keep answers under 200 words unless asked for detail.`,
    ].filter(Boolean).join("\n");
  };

  const sendCoachMessage = async (text) => {
    const msg = (text || "").trim();
    if (!msg || coachLoading) return;
    if (!calorieApiKey) { setCoachError("Add your Gemini API key in Me → Food Tracker to enable the coach."); return; }
    setCoachError("");
    const history = [...coachChat, { role: "user", text: msg }];
    setCoachChat(history);
    setCoachInput("");
    setCoachLoading(true);
    try {
      // Gemini requires strict user/model alternation. An even-sized window
      // over an odd-length history starts on a model turn (400 on every
      // model), and a mid-request app kill can persist two user turns in a
      // row — so trim to a user-first window and merge any same-role runs.
      const recent = history.slice(-12);
      while (recent.length && recent[0].role !== "user") recent.shift();
      const turns = [];
      recent.forEach(m => {
        const role = m.role === "user" ? "user" : "model";
        if (turns.length && turns[turns.length - 1].role === role) {
          turns[turns.length - 1].parts[0].text += "\n\n" + m.text;
        } else {
          turns.push({ role, parts: [{ text: m.text }] });
        }
      });
      const contents = [
        { role: "user", parts: [{ text: buildCoachContext() }] },
        { role: "model", parts: [{ text: "Understood — I'm ready to coach." }] },
        ...turns,
      ];
      const gem = await geminiGenerate(calorieApiKey, {
        contents,
        generationConfig: { maxOutputTokens: 1024, thinkingConfig: { thinkingBudget: 0 } },
      });
      const responseText = gem.text;
      if (!responseText) throw new Error("Empty response — try again");
      setCoachChat(prev => [...prev, { role: "model", text: responseText.trim() }]);
    } catch (e) {
      setCoachError(e.message || "Coach unavailable");
      setCoachChat(prev => prev.filter((m, i) => !(i === prev.length - 1 && m.role === "user" && m.text === msg)));
      setCoachInput(msg);
      reportAppError("coach", e.message, e.attempts ? { attempts: e.attempts } : null);
    }
    setCoachLoading(false);
  };

  // Workout selection helpers (quick-select in the Habits tab, follows active routine)
  const WORKOUT_DAY_OPTIONS = routine === "sh90"
    ? [
        { day: 1, label: "LEG A" },
        { day: 2, label: "TOR A" },
        { day: 3, label: "ARM A" },
        { day: 4, label: "LEG B" },
        { day: 5, label: "TOR B" },
        { day: 6, label: "ARM B" },
      ]
    : routine === "yoga"
      ? [{ day: 1, label: "YOGA" }]
      : [1, 2, 3, 4, 5, 6, 7]
          .filter(d => (getRoutineDayData(routine, 1, d)?.exercises || []).length > 0)
          .map(d => {
            const dl = getRoutineDayData(routine, 1, d)?.label || "";
            // Keep enough words to tell similar days apart (PHAT: LOWER POWER vs LOWER HYP)
            const words = dl.split(" ").filter(w => w !== "·");
            return { day: d, label: words.slice(0, 2).join(" ").slice(0, 11), weekday: ["", "MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"][d] };
          });
  const getWorkoutSelection = () => workoutSelection[selectedDate] || null;
  const selectWorkout = (dayOption) => {
    setWorkoutSelection(prev => ({
      ...prev,
      [selectedDate]: dayOption
    }));
    toggleHabit(3, true);
    syncWorkoutSelection(selectedDate, dayOption);
    // Keep the Workout tab in agreement: record (or retarget) a quick-logged session.
    // Never touch a session created in the Workout tab itself.
    const existing = sessionLog[selectedDate];
    if (routine !== "yoga" && (!existing || existing.quickLogged)) {
      const sess = {
        week: routine === "sh90" ? nextWorkoutPos.week : 0,
        day: dayOption.day, routine: routine,
        completedAt: selectedDate + "T12:00:00", status: "completed", quickLogged: true,
      };
      setSessionLog(prev => ({ ...prev, [selectedDate]: sess }));
      syncSession(selectedDate, sess);
      // Only roll the schedule forward when the logged type IS the scheduled one —
      // logging ARM B while the pointer waits at TOR A must not skip workouts
      if (routine === "sh90" && dayOption.day === nextWorkoutPos.day) {
        advanceSh90Position(nextWorkoutPos.week, nextWorkoutPos.day, selectedDate);
      }
    }
  };
  // Remove a habit-tab quick-logged session (used by uncheck / rest-day undo)
  const removeQuickLoggedSession = () => {
    if (sessionLog[selectedDate]?.quickLogged) {
      setSessionLog(prev => { const n = { ...prev }; delete n[selectedDate]; return n; });
      deleteFromSupabase("sessions", { date: selectedDate });
    }
  };

  // ── Weight Logging Helpers ──
  const selectedWeight = weightLog[selectedDate] || null;
  
  const getSortedWeights = () => {
    return Object.entries(weightLog)
      .filter(([_, v]) => v > 0)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([date, weight]) => ({ date, weight }));
  };
  
  const sortedWeights = getSortedWeights();
  const selectedWeightIdx = sortedWeights.findIndex(e => e.date === selectedDate);
  const prevWeightEntry = selectedWeightIdx > 0 ? sortedWeights[selectedWeightIdx - 1] : (sortedWeights.length > 0 && !selectedWeight ? sortedWeights[sortedWeights.length - 1] : null);
  const weightChange = selectedWeight && prevWeightEntry ? (selectedWeight - prevWeightEntry.weight) : null;
  
  const allWeights = sortedWeights.map(e => e.weight);
  const startWeight = allWeights.length > 0 ? allWeights[0] : null;
  const currentWeight = allWeights.length > 0 ? allWeights[allWeights.length - 1] : null;
  const totalChange = startWeight && currentWeight ? currentWeight - startWeight : null;
  
  const logWeight = (val) => {
    const num = parseFloat(val);
    if (!isNaN(num) && num > 0) {
      setWeightLog(prev => ({ ...prev, [selectedDate]: num }));
      setWeightInput(String(num));
      setWeightLogAnim(true);
      setTimeout(() => setWeightLogAnim(false), 600);
      toggleHabit(4, true);
      syncWeight(selectedDate, num);
    }
  };

  const commitWeightInput = () => {
    const v = parseFloat(weightInput);
    if (!isNaN(v) && v > 50 && v < 500) {
      setWeightLog(prev => ({ ...prev, [selectedDate]: v }));
      setWeightInput(String(v));
      toggleHabit(4, true);
      syncWeight(selectedDate, v);
    } else if (weightInput === "") {
      setWeightLog(prev => { const n = {...prev}; delete n[selectedDate]; return n; });
      toggleHabit(4, false);
      deleteFromSupabase("weight_log", { date: selectedDate });
    }
  };
  
  const adjustWeight = (delta) => {
    const current = selectedWeight || parseFloat(weightInput) || (prevWeightEntry?.weight) || 160;
    const newVal = Math.round((current + delta) * 10) / 10;
    setWeightLog(prev => ({ ...prev, [selectedDate]: newVal }));
    setWeightInput(String(newVal));
    setWeightLogAnim(true);
    setTimeout(() => setWeightLogAnim(false), 600);
    toggleHabit(4, true);
    syncWeight(selectedDate, newVal);
  };
  
  const last7Weights = sortedWeights.slice(-7);

  // Resolve swap with cross-week fallback (same exercise on same day carries across weeks)
  const resolveSwap = (w, d, exName, rk = routine) => {
    if (rk !== "sh90") {
      // Weekday routines: swaps are keyed by routine, not week
      return swappedExercises[`${rk}-${d}-${exName}`] || exName;
    }
    const key = `${w}-${d}-${exName}`;
    if (swappedExercises[key]) return swappedExercises[key];
    for (let wk = w - 1; wk >= 1; wk--) {
      const fb = `${wk}-${d}-${exName}`;
      if (swappedExercises[fb]) return swappedExercises[fb];
    }
    for (let wk = w + 1; wk <= 12; wk++) {
      const fb = `${wk}-${d}-${exName}`;
      if (swappedExercises[fb]) return swappedExercises[fb];
    }
    return exName;
  };

  const resolveDisplay = (w, d, exName, rk = routine) => {
    const swapped = resolveSwap(w, d, exName, rk);
    if (swapped !== exName) return swapped; // manual swap takes priority
    if (workoutMode === "home") {
      const alts = ALTERNATIVES[exName] || [];
      const homeAlt = alts.find(a => a.startsWith("H: "));
      if (homeAlt) return homeAlt;
    }
    if (workoutMode === "bodyweight") {
      const alts = ALTERNATIVES[exName] || [];
      const bwAlt = alts.find(a => a.startsWith("BW: "));
      if (bwAlt) return bwAlt;
    }
    return exName;
  };
  const displayName = (exName) => crossRoutineSession
    ? resolveDisplay(_selSess.week, _selSess.day, exName, _selSessRoutine)
    : resolveDisplay(week, day, exName);

  const swapExercise = (originalName, newName) => {
    const key = routine === "sh90" ? `${week}-${day}-${originalName}` : `${routine}-${day}-${originalName}`;
    setSwappedExercises(prev => ({ ...prev, [key]: newName }));
    setShowAlts(null);
    // Weekday-routine swaps sync as week 0 with the routine encoded in the
    // exercise name — the restore path decodes this back into the local key.
    if (routine === "sh90") syncExerciseSwap(week, day, originalName, newName);
    else syncExerciseSwap(0, day, `${routine}:${originalName}`, newName);
  };

  return (
    <div style={{
      fontFamily: "'DM Sans', 'Helvetica Neue', sans-serif",
      background: t.bg, color: t.text, height: "100vh",
      maxWidth: 430, margin: "0 auto", position: "relative",
      display: "flex", flexDirection: "column", overflow: "hidden",
    }}>
      {/* ── Header ── */}
      <div className="safe-top" style={{ background: t.bg }}>
        <div style={{
          padding: "12px 20px 12px", display: "flex", alignItems: "center",
          justifyContent: "space-between", borderBottom: `1px solid ${t.border}`,
        }}>
          <div>
            <div style={{ fontSize: fs(11), fontWeight: 500, color: t.accent, letterSpacing: 2, textTransform: "uppercase", fontFamily: "'DM Mono', monospace" }}>
              SUPERHUMAN 90
            </div>
            <div style={{ fontSize: fs(13), color: t.textDim, marginTop: 2 }}>
              {headerSub}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {profile.name && (
              <div style={{ fontSize: fs(13), color: t.textDim, fontWeight: 500 }}>
                {profile.name.split(" ")[0]}
              </div>
            )}
            <button onClick={() => { setShowTicketModal(true); setTicketsError(""); setTicketDone(false); }}
              aria-label="Get help / file a ticket"
              style={{
                width: 32, height: 32, borderRadius: 10, border: `1px solid ${t.border}`,
                background: t.card, fontSize: fs(15), cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
              🛟
            </button>
          </div>
        </div>
      </div>

      {/* Update-ready banner */}
      {updateReady && (
        <button onClick={applyUpdate} style={{
          width: "100%", padding: "9px 16px", border: "none", cursor: "pointer",
          background: t.gradient, color: "#fff", fontSize: fs(12), fontWeight: 700,
          fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
        }}>
          ⬆️ {updateReady} is ready — tap to update
        </button>
      )}

      {/* File-a-ticket bottom sheet (available on every tab) */}
      {showTicketModal && (
        <div onClick={() => setShowTicketModal(false)} style={{
          position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.55)",
          display: "flex", alignItems: "flex-end", justifyContent: "center",
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            width: "100%", maxWidth: 430, maxHeight: "85vh", overflowY: "auto",
            background: t.card, borderRadius: "20px 20px 0 0", padding: "16px 18px 28px",
          }}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}>
              <div style={{ width: 36, height: 4, borderRadius: 2, background: t.border }} />
            </div>
            {ticketDone ? (
              <div style={{ textAlign: "center", padding: "24px 0" }}>
                <div style={{ fontSize: fs(32), marginBottom: 8 }}>✓</div>
                <div style={{ fontSize: fs(15), fontWeight: 700, color: t.success }}>Ticket received.</div>
                <div style={{ fontSize: fs(12), color: t.textDim, marginTop: 4 }}>
                  The nightly maintenance agent picks it up at 4 AM — track it in Me → Support & Tickets.
                </div>
              </div>
            ) : (
              <>
                <div style={{ fontSize: fs(17), fontWeight: 700, marginBottom: 2 }}>Get help</div>
                <div style={{ fontSize: fs(12), color: t.textDim, marginBottom: 14 }}>
                  Bugs, wrong numbers, ideas — goes straight into the fix queue.
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                  <select value={ticketForm.category} onChange={e => setTicketForm(p => ({ ...p, category: e.target.value }))}
                    style={{ padding: "10px 8px", borderRadius: 10, border: `1px solid ${t.border}`, background: t.cardAlt, color: t.text, fontSize: fs(13), fontFamily: "inherit", outline: "none" }}>
                    <option value="bug">Bug / broken</option>
                    <option value="feature_request">Feature request</option>
                    <option value="data_issue">Data issue</option>
                    <option value="question">Question</option>
                    <option value="other">Other</option>
                  </select>
                  <select value={ticketForm.priority} onChange={e => setTicketForm(p => ({ ...p, priority: e.target.value }))}
                    style={{ padding: "10px 8px", borderRadius: 10, border: `1px solid ${t.border}`, background: t.cardAlt, color: t.text, fontSize: fs(13), fontFamily: "inherit", outline: "none" }}>
                    <option value="low">Low</option>
                    <option value="normal">Normal</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                  </select>
                </div>
                <input
                  placeholder="Short summary"
                  value={ticketForm.subject}
                  maxLength={200}
                  onChange={e => setTicketForm(p => ({ ...p, subject: e.target.value }))}
                  style={{
                    width: "100%", padding: "10px 12px", borderRadius: 10, border: `1px solid ${t.border}`,
                    background: t.cardAlt, color: t.text, fontSize: fs(14), fontFamily: "inherit",
                    outline: "none", boxSizing: "border-box", marginBottom: 8,
                  }}
                />
                <textarea
                  placeholder="What happened / what you want changed..."
                  value={ticketForm.body}
                  onChange={e => setTicketForm(p => ({ ...p, body: e.target.value }))}
                  rows={4}
                  style={{
                    width: "100%", padding: "12px", borderRadius: 10, border: `1px solid ${t.border}`,
                    background: t.cardAlt, color: t.text, fontSize: fs(13), fontFamily: "inherit",
                    resize: "vertical", outline: "none", lineHeight: 1.5, boxSizing: "border-box", marginBottom: 8,
                  }}
                />
                {ticketsError && (
                  <div style={{ padding: "8px 10px", borderRadius: 8, marginBottom: 8, background: t.danger + "15", color: t.danger, fontSize: fs(12), fontWeight: 600 }}>
                    {ticketsError}
                  </div>
                )}
                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={submitTicket}
                    disabled={ticketSubmitting || ticketForm.subject.trim().length < 3 || ticketForm.body.trim().length < 10}
                    style={{
                      flex: 1, padding: "12px", borderRadius: 10, border: "none",
                      background: (ticketForm.subject.trim().length >= 3 && ticketForm.body.trim().length >= 10 && !ticketSubmitting) ? t.gradient : t.cardAlt,
                      color: (ticketForm.subject.trim().length >= 3 && ticketForm.body.trim().length >= 10 && !ticketSubmitting) ? "#fff" : t.textMuted,
                      fontSize: fs(14), fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
                    }}>
                    {ticketSubmitting ? "Sending..." : "Send Ticket"}
                  </button>
                  <button onClick={() => setShowTicketModal(false)}
                    style={{
                      padding: "12px 18px", borderRadius: 10, border: `1px solid ${t.border}`,
                      background: "transparent", color: t.text, fontSize: fs(14), fontWeight: 600,
                      cursor: "pointer", fontFamily: "inherit",
                    }}>
                    Cancel
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* ── Date Navigator ── */}
      <div style={{
        padding: "12px 16px 10px",
        borderBottom: `1px solid ${t.border}`,
        background: t.bg,
      }}>
        {/* Week navigation row */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <button onClick={() => shiftWeek(-1)}
            style={{
              width: 32, height: 32, borderRadius: 8, border: `1px solid ${t.border}`,
              background: t.card, color: t.text, cursor: "pointer", fontSize: fs(14),
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>◂</button>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: fs(14), fontWeight: 600 }}>{weekLabel}</div>
            {programDay > 0 && programDay <= (routine === "sh90" ? 90 : cycleLenDays) && (
              <div style={{ fontSize: fs(11), color: t.accent, fontFamily: "'DM Mono', monospace", fontWeight: 600 }}>
                {maintenanceOn ? `Cycle paused · maintenance` : routine === "sh90" ? `Program Day ${programDay} of 90` : `Cycle Day ${programDay} of ${cycleLenDays}`}
              </div>
            )}
          </div>
          <button onClick={() => shiftWeek(1)}
            style={{
              width: 32, height: 32, borderRadius: 8, border: `1px solid ${t.border}`,
              background: t.card, color: t.text, cursor: "pointer", fontSize: fs(14),
              display: "flex", alignItems: "center", justifyContent: "center",
              opacity: (() => { const nextMon = new Date(weekDays[0] + "T12:00:00"); nextMon.setDate(nextMon.getDate() + 7); return toLocalDateStr(nextMon) <= todayStr; })() ? 1 : 0.3,
            }}>▸</button>
        </div>

        {/* 7-day week grid */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
          {weekDays.map(ds => {
            const d = new Date(ds + "T12:00:00");
            const dayName = d.toLocaleDateString(undefined, { weekday: "short" }).toUpperCase();
            const dayNum = d.getDate();
            const monthShort = d.toLocaleDateString(undefined, { month: "short" }).toUpperCase();
            const isSel = ds === selectedDate;
            const isTodayDate = ds === todayStr;
            const isFuture = ds > todayStr;
            const hasW = dateHasWorkout(ds);
            const hasH = dateHasHabits(ds);
            const hasWt = dateHasWeight(ds);
            const hasAny = hasW || hasH || hasWt;

            return (
              <button key={ds}
                onClick={() => setSelectedDate(ds)}
                style={{
                  padding: "6px 2px 5px",
                  borderRadius: 12,
                  border: isSel && !isTodayDate ? `2px solid ${t.accent}` : "2px solid transparent",
                  background: isTodayDate
                    ? t.gradient
                    : isSel ? t.accentGlow : "transparent",
                  cursor: "pointer",
                  opacity: 1,
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 0,
                  color: t.text, fontFamily: "'DM Mono', monospace",
                  position: "relative",
                  boxShadow: isTodayDate ? `0 3px 12px ${t.accent}50` : "none",
                  transition: "all 0.15s ease",
                }}>
                <span style={{
                  fontSize: fs(9), fontWeight: 600, letterSpacing: 0.5,
                  color: isTodayDate ? "rgba(255,255,255,0.8)" : t.textDim,
                }}>{dayName}</span>
                <span style={{
                  fontSize: fs(18), fontWeight: isTodayDate ? 800 : isSel ? 700 : 500,
                  color: isTodayDate ? "#fff" : isSel ? t.accent : t.text,
                  lineHeight: 1.3,
                }}>{dayNum}</span>
                {/* Show month abbreviation on 1st of month or first day in strip */}
                {(dayNum === 1 || ds === weekDays[0]) && (
                  <span style={{
                    fontSize: fs(7), fontWeight: 700, letterSpacing: 0.5,
                    color: isTodayDate ? "rgba(255,255,255,0.7)" : t.textDim,
                    lineHeight: 1,
                  }}>{monthShort}</span>
                )}
                {dayNum !== 1 && ds !== weekDays[0] && !isTodayDate && (
                  <div style={{ display: "flex", gap: 2, marginTop: 2, height: 5 }}>
                    {hasW && <div style={{ width: 5, height: 5, borderRadius: 3, background: t.success }} />}
                    {hasH && <div style={{ width: 5, height: 5, borderRadius: 3, background: t.accent }} />}
                    {hasWt && <div style={{ width: 5, height: 5, borderRadius: 3, background: t.warning }} />}
                  </div>
                )}
                {isTodayDate && (
                  <span style={{
                    fontSize: fs(7), fontWeight: 800, color: "#fff", letterSpacing: 1,
                    lineHeight: 1, marginTop: 1,
                  }}>TODAY</span>
                )}
                {!hasAny && !isTodayDate && dayNum !== 1 && ds !== weekDays[0] && (
                  <div style={{ height: 5, marginTop: 2 }} />
                )}
              </button>
            );
          })}
        </div>

        {/* Jump to today (if not in current week) */}
        {!weekDays.includes(todayStr) && (
          <button onClick={() => setSelectedDate(todayStr)}
            style={{
              width: "100%", marginTop: 8, padding: "7px", borderRadius: 8,
              border: "none", background: t.accent + "18", color: t.accent,
              fontSize: fs(12), fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
            }}>
            ↩ Back to Today
          </button>
        )}
      </div>
      {/* ── Content Area ── */}
      <div style={{ flex: 1, overflowY: "auto", overflowX: "hidden", paddingBottom: 160, WebkitOverflowScrolling: "touch" }}>

        {/* ═══ WORKOUT TAB ═══ */}
        {tab === "workout" && (
          <div style={{ padding: "16px 16px 0" }}>

            {/* Session Status Banner */}
            {(() => {
              const sessRoutine = selectedSession ? (selectedSession.routine || "sh90") : null;
              // Get the workout label for the session
              const sessionWorkoutLabel = sessRoutine === "yoga"
                ? (selectedSession.label || "Yoga Session")
                : selectedSession?.day
                  ? getRoutineDayData(sessRoutine, selectedSession.week, selectedSession.day)?.label
                  : null;

              // CASE 1: Completed session
              if (selectedSession?.status === "completed") {
                const compExercises = sessRoutine === "yoga" ? [] : (getRoutineDayData(sessRoutine, selectedSession.week, selectedSession.day)?.exercises || []);
                let compTotal = compExercises.length, compDone = 0;
                compExercises.forEach(ex => {
                  const dn = resolveDisplay(selectedSession.week, selectedSession.day, ex.name, sessRoutine);
                  let allSetsDone = ex.sets > 0;
                  for (let si = 0; si < ex.sets; si++) {
                    if (!logData[`${selectedDate}-${dn}-${si}`]?.done) { allSetsDone = false; break; }
                  }
                  if (allSetsDone) compDone++;
                });
                const compPct = compTotal > 0 ? Math.round((compDone / compTotal) * 100) : 0;

                // Calculate workout duration
                let durationStr = "";
                if (selectedSession.startedAt && selectedSession.completedAt) {
                  const durSec = Math.floor((new Date(selectedSession.completedAt) - new Date(selectedSession.startedAt)) / 1000);
                  if (durSec > 0 && durSec < 86400) {
                    const h = Math.floor(durSec / 3600);
                    const m = Math.floor((durSec % 3600) / 60);
                    const s = durSec % 60;
                    durationStr = h > 0 ? `${h}h ${m}m` : `${m}:${s.toString().padStart(2, "0")}`;
                  }
                }

                // Calculate average workout duration
                let avgStr = "";
                const durations = Object.values(sessionLog).filter(s =>
                  s.status === "completed" && s.startedAt && s.completedAt
                ).map(s => Math.floor((new Date(s.completedAt) - new Date(s.startedAt)) / 1000))
                  .filter(d => d > 0 && d < 86400);
                if (durations.length > 1) {
                  const avgSec = Math.round(durations.reduce((a, b) => a + b, 0) / durations.length);
                  const ah = Math.floor(avgSec / 3600);
                  const am = Math.floor((avgSec % 3600) / 60);
                  avgStr = ah > 0 ? `${ah}h ${am}m` : `${am}m`;
                }

                return (
                  <div style={{
                    padding: "12px 14px", borderRadius: 12, marginBottom: 14,
                    background: t.card, border: `1px solid ${t.success}30`,
                  }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <span style={{ fontSize: fs(18) }}>{sessRoutine === "yoga" ? "🧘" : "✅"}</span>
                        <div>
                          <div style={{ fontSize: fs(13), fontWeight: 600, color: t.success }}>
                            {sessionWorkoutLabel || "Workout"}{sessRoutine === "yoga" ? " — Done" : ` — ${compPct}%`}
                            {durationStr && <span style={{ fontWeight: 500, opacity: 0.85 }}> · {durationStr}</span>}
                          </div>
                          <div style={{ fontSize: fs(11), color: t.textDim, fontFamily: "'DM Mono', monospace" }}>
                            {sessRoutine === "yoga"
                              ? (selectedSession.channel || "YouTube session")
                              : <>{sessRoutine === "sh90" ? `W${selectedSession.week} D${selectedSession.day}` : ROUTINES[sessRoutine].name} · {compDone}/{compTotal} exercises{avgStr && ` · avg ${avgStr}`}</>}
                          </div>
                        </div>
                      </div>
                      <button onClick={() => {
                          if (sessRoutine === "yoga") {
                            setSessionLog(prev => { const n = { ...prev }; delete n[selectedDate]; return n; });
                            deleteFromSupabase("sessions", { date: selectedDate });
                          } else { reopenSession(); }
                        }}
                        style={{
                          padding: "5px 10px", borderRadius: 6, border: `1px solid ${t.border}`,
                          background: "transparent", color: t.textDim, fontSize: fs(11),
                          cursor: "pointer", fontFamily: "'DM Mono', monospace",
                        }}>
                        {sessRoutine === "yoga" ? "Remove" : "Edit"}
                      </button>
                    </div>
                    {/* Progress bar */}
                    {sessRoutine !== "yoga" && (
                      <div style={{
                        marginTop: 8, height: 4, borderRadius: 2,
                        background: t.border, overflow: "hidden",
                      }}>
                        <div style={{
                          height: "100%", borderRadius: 2,
                          width: `${compPct}%`, background: t.success,
                        }} />
                      </div>
                    )}
                  </div>
                );
              }
              // CASE 2: Active session (in progress)
              if (selectedSession?.status === "active") {
                // Calculate workout completion %
                const sessionExercises = getRoutineDayData(sessRoutine, selectedSession.week, selectedSession.day)?.exercises || [];
                let totalEx = sessionExercises.length, doneEx = 0;
                sessionExercises.forEach(ex => {
                  const dn = resolveDisplay(selectedSession.week, selectedSession.day, ex.name, sessRoutine);
                  let allSetsDone = ex.sets > 0;
                  for (let si = 0; si < ex.sets; si++) {
                    if (!logData[`${selectedDate}-${dn}-${si}`]?.done) { allSetsDone = false; break; }
                  }
                  if (allSetsDone) doneEx++;
                });
                const pct = totalEx > 0 ? Math.round((doneEx / totalEx) * 100) : 0;

                return (
                  <div style={{
                    padding: "12px 14px", borderRadius: 12, marginBottom: 14,
                    background: t.success + "10", border: `1px solid ${t.success}30`,
                  }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <div style={{
                          width: 10, height: 10, borderRadius: "50%", background: t.success,
                          boxShadow: `0 0 8px ${t.success}80`,
                          animation: "pulse 2s ease-in-out infinite",
                        }} />
                        <div>
                          <div style={{ fontSize: fs(13), fontWeight: 600, color: t.success }}>
                            {sessionWorkoutLabel || "Workout"} — {pct}%
                          </div>
                          <div style={{ fontSize: fs(11), color: t.textDim, fontFamily: "'DM Mono', monospace" }}>
                            {sessRoutine === "sh90" ? `W${selectedSession.week} D${selectedSession.day}` : ROUTINES[sessRoutine]?.name} · {doneEx}/{totalEx} exercises
                            {elapsed && ` · ${elapsed}`}
                          </div>
                        </div>
                      </div>
                      <button onClick={completeSession}
                        style={{
                          padding: "8px 16px", borderRadius: 8, border: "none",
                          background: t.success, color: "#fff", fontSize: fs(13),
                          fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
                        }}>
                        Finish ✓
                      </button>
                    </div>
                    {/* Progress bar */}
                    <div style={{
                      marginTop: 8, height: 4, borderRadius: 2,
                      background: t.border, overflow: "hidden",
                    }}>
                      <div style={{
                        height: "100%", borderRadius: 2,
                        width: `${pct}%`, background: t.success,
                        transition: "width 0.3s ease",
                      }} />
                    </div>
                  </div>
                );
              }
              // CASE 3: No session — Today → Start, Past → Rest Day, Future → Preview
              const isFutureDate = selectedDate > todayStr;
              if (routine === "yoga") return null; // yoga library below has its own controls
              const nextPos = getNextWorkoutPosition();
              const sh90RoundCount = Object.entries(sessionLog)
                .filter(([date, s]) => s.status === "completed" && (s.routine || "sh90") === "sh90" && date >= rounds.startDate).length;

              // Program complete (SH90, current round) — 68 defined workouts (11 weeks × 6 + 2-day deload)
              if (routine === "sh90" && sh90RoundCount >= 68 && !isFutureDate && !isPastDate) {
                return (
                  <div style={{
                    padding: "20px 14px", borderRadius: 14, marginBottom: 14,
                    background: t.card, border: `2px solid ${t.success}`,
                    textAlign: "center",
                  }}>
                    <div style={{ fontSize: fs(28), marginBottom: 6 }}>🏆</div>
                    <div style={{ fontSize: fs(16), fontWeight: 700, color: t.success }}>Round {rounds.current} Complete!</div>
                    <div style={{ fontSize: fs(12), color: t.textDim, marginTop: 4 }}>All {sh90RoundCount} workouts finished. You did it.</div>
                    <button onClick={startNewRound}
                      style={{
                        marginTop: 12, padding: "10px 20px", borderRadius: 10, border: "none",
                        background: t.gradient, color: "#fff", fontSize: fs(13), fontWeight: 600,
                        cursor: "pointer", fontFamily: "inherit",
                      }}>
                      Start Round {rounds.current + 1} →
                    </button>
                  </div>
                );
              }

              // Scheduled rest day (weekday routines)
              if (isRestDay && !isPastDate) {
                return (
                  <div style={{
                    padding: "18px 14px", borderRadius: 14, marginBottom: 14,
                    background: t.card, border: `1px solid ${t.border}`, textAlign: "center",
                  }}>
                    <div style={{ fontSize: fs(24), marginBottom: 4 }}>😴</div>
                    <div style={{ fontSize: fs(15), fontWeight: 600 }}>{dayData?.label === "REST" ? "Scheduled Rest Day" : dayData?.label}</div>
                    {dayData?.desc && <div style={{ fontSize: fs(11), color: t.textDim, marginTop: 4, lineHeight: 1.5 }}>{dayData.desc}</div>}
                    <div style={{ fontSize: fs(11), color: t.textDim, marginTop: 6 }}>Want to train anyway? Pick a day below.</div>
                  </div>
                );
              }

              // Past date with no session → Rest Day
              if (isPastDate) {
                return (
                  <div style={{
                    padding: "14px", borderRadius: 14, marginBottom: 14,
                    background: t.card, border: `1px solid ${t.border}`,
                    textAlign: "center",
                  }}>
                    <div style={{ fontSize: fs(13), color: t.textDim, marginBottom: 2 }}>{selectedDateLabel}</div>
                    <div style={{ fontSize: fs(15), fontWeight: 600, color: t.textDim }}>Rest Day</div>
                    <button onClick={logPastSession}
                      style={{
                        marginTop: 10, padding: "8px 16px", borderRadius: 8,
                        border: `1px dashed ${t.accent}40`, background: "transparent",
                        color: t.accent, fontSize: fs(12), cursor: "pointer",
                        fontFamily: "inherit",
                      }}>
                      Actually worked out? Log it
                    </button>
                  </div>
                );
              }

              // Today or future — check if there's already logged exercise data
              let preDone = 0;
              const preExercises = !isFutureDate ? (dayData?.exercises || []) : [];
              const preTotal = preExercises.length;
              if (!isFutureDate) {
                preExercises.forEach(ex => {
                  const dn = displayName(ex.name);
                  let allDone = ex.sets > 0;
                  for (let si = 0; si < ex.sets; si++) {
                    if (!logData[`${selectedDate}-${dn}-${si}`]?.done) { allDone = false; break; }
                  }
                  if (allDone) preDone++;
                });
              }
              const prePct = preTotal > 0 ? Math.round((preDone / preTotal) * 100) : 0;
              const hasProgress = preDone > 0;

              return (
                <div style={{ marginBottom: 14 }}>
                  <button onClick={isFutureDate ? null : startSession}
                    style={{
                      width: "100%", padding: "14px", borderRadius: 14,
                      border: `2px dashed ${t.accent}40`, background: hasProgress ? t.success + "10" : t.accentGlow,
                      color: hasProgress ? t.success : t.accent, fontSize: fs(14), fontWeight: 600,
                      cursor: isFutureDate ? "default" : "pointer",
                      fontFamily: "inherit", display: "flex", alignItems: "center",
                      justifyContent: "center", gap: 8,
                      borderColor: hasProgress ? t.success + "40" : t.accent + "40",
                    }}>
                    {isFutureDate
                      ? (routine === "sh90" ? `Upcoming — W${week} D${day} (${dayData?.label})` : `Upcoming — ${dayData?.label || "Rest"}`)
                      : hasProgress
                        ? `▶ Resume Workout — ${prePct}% (${preDone}/${preTotal})`
                        : (routine === "sh90" ? `▶ Start Workout — W${week} D${day} (${dayData?.label})` : `▶ Start Workout — ${dayData?.label}`)
                    }
                  </button>
                  {hasProgress && !isFutureDate && (
                    <div style={{
                      marginTop: 6, height: 4, borderRadius: 2,
                      background: t.border, overflow: "hidden",
                    }}>
                      <div style={{
                        height: "100%", borderRadius: 2,
                        width: `${prePct}%`, background: t.success,
                      }} />
                    </div>
                  )}
                </div>
              );
            })()}
            {/* Week & Day Selector (SH90 only) */}
            {routine === "sh90" && !crossRoutineSession && (
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              <button onClick={() => setShowWeekPicker(!showWeekPicker)}
                style={{
                  flex: 1, padding: "10px 14px", borderRadius: 12, border: `1px solid ${t.border}`,
                  background: t.card, color: t.text, fontSize: fs(14), fontFamily: "inherit",
                  cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between",
                }}
              >
                <span style={{ fontWeight: 600 }}>Week {week}</span>
                <span style={{ fontSize: fs(10), color: t.textDim }}>▼</span>
              </button>
            </div>
            )}

            {routine === "sh90" && !crossRoutineSession && showWeekPicker && (
              <div style={{
                background: t.card, border: `1px solid ${t.border}`, borderRadius: 14,
                padding: 10, marginBottom: 12, display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6,
              }}>
                {Array.from({ length: 12 }, (_, i) => i + 1).map(w => (
                  <button key={w} onClick={() => {
                      setWeek(w); setShowWeekPicker(false);
                      // Browsing must not corrupt records: only move the schedule pointer
                      // when picking today's not-yet-started workout, and only rewrite a
                      // session that is still ACTIVE (never a completed one).
                      if (selectedDate === todayStr && !selectedSession) {
                        setNextWorkoutPos({ week: w, day });
                      }
                      if (selectedSession?.status === "active" && (selectedSession.routine || "sh90") === "sh90") {
                        const upd = { ...selectedSession, week: w };
                        setSessionLog(prev => ({ ...prev, [selectedDate]: upd }));
                        syncSession(selectedDate, upd);
                      }
                    }}
                    style={{
                      padding: "8px 0", borderRadius: 8, border: "none", cursor: "pointer",
                      background: week === w ? t.accent : t.cardAlt,
                      color: week === w ? "#fff" : t.textDim, fontSize: fs(13), fontWeight: 600,
                      fontFamily: "inherit",
                    }}
                  >{w}</button>
                ))}
              </div>
            )}

            {/* Day Pills */}
            {routine !== "yoga" && !crossRoutineSession && (
            <div style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto" }}>
              {(routine === "sh90" ? [1, 2, 3, 4, 5, 6].filter(d => weekData?.[d]) : [1, 2, 3, 4, 5, 6, 7]).map(d => {
                const WD = ["", "MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
                let pillText;
                if (routine === "sh90") {
                  const dl = weekData?.[d]?.label || "";
                  const short = dl.replace("LEGS", "LEG").replace("TORSO", "TOR").replace("ARMS", "ARM").replace(" (DELOAD)", "");
                  pillText = `D${d} ${short}`;
                } else {
                  const dl = getRoutineDayData(routine, week, d)?.label || "";
                  const short = dl.length > 10 ? dl.split(" ")[0].replace(" ·", "") : dl;
                  pillText = `${WD[d]} ${short === "REST" ? "😴" : short}`;
                }
                return (
                  <button key={d} onClick={() => {
                      setDay(d); setExpandedEx(null);
                      // Browsing must not corrupt records: only move the schedule pointer
                      // when picking today's not-yet-started workout, and only rewrite a
                      // session that is still ACTIVE (never a completed one).
                      if (routine === "sh90" && selectedDate === todayStr && !selectedSession) {
                        setNextWorkoutPos({ week, day: d });
                      }
                      if (selectedSession?.status === "active" && (selectedSession.routine || "sh90") === routine) {
                        const upd = { ...selectedSession, day: d };
                        setSessionLog(prev => ({ ...prev, [selectedDate]: upd }));
                        syncSession(selectedDate, upd);
                      }
                    }}
                    style={{
                      padding: "8px 12px", borderRadius: 10, border: day === d ? "none" : `1px solid ${t.border}`,
                      background: day === d ? t.gradient : t.card,
                      color: day === d ? "#fff" : t.textDim, fontSize: fs(11), fontWeight: 600,
                      cursor: "pointer", whiteSpace: "nowrap", fontFamily: "'DM Mono', monospace",
                      letterSpacing: 0.5, flexShrink: 0,
                    }}
                  >
                    {pillText}
                  </button>
                );
              })}
            </div>
            )}

            {/* Cycle-phase banner: build week target / de-escalation / maintenance */}
            {ROUTINES[routine]?.weekday && !crossRoutineSession && programDay > 0 && programDay <= cycleLenDays && (() => {
              const color = roundPhase.key === "maintenance" ? t.success
                : roundPhase.key === "deescalation" ? t.warning
                : t.accent;
              const icon = roundPhase.key === "maintenance" ? "🛡️"
                : roundPhase.key === "deescalation" ? "🌊"
                : (roundPhase.week || 1) >= cycleBuildWeeks ? "🔥" : "📈";
              return (
                <div style={{
                  padding: "10px 14px", borderRadius: 12, marginBottom: 12,
                  background: color + "12", border: `1px solid ${color}40`,
                }}>
                  <div style={{
                    fontSize: fs(11), fontWeight: 700, letterSpacing: 1.5,
                    fontFamily: "'DM Mono', monospace", color: color,
                  }}>
                    {icon} {roundPhase.label}{roundPhase.key !== "maintenance" && ` · DAY ${programDay} OF ${cycleLenDays}`}
                  </div>
                  <div style={{ fontSize: fs(11), color: t.textDim, marginTop: 3, lineHeight: 1.5 }}>
                    {roundPhase.tip}
                    {roundPhase.key === "deescalation" && (
                      <> Cycle {rounds.current + 1} begins {(() => { const d = new Date(rounds.startDate + "T12:00:00"); d.setDate(d.getDate() + cycleLenDays); return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); })()}.</>
                    )}
                    {(rounds.emphasis || "hypertrophy") === "strength" && roundPhase.key === "build" && (
                      <> <b>Strength block:</b> compounds 2-3×4-6 @ 3-4 RIR, rest 3+ min; isolations stay light.</>
                    )}
                  </div>
                </div>
              );
            })()}

            {/* Day Header */}
            {(routine !== "yoga" || crossRoutineSession) && dayData && (
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: fs(20), fontWeight: 700 }}>
                {crossRoutineSession
                  ? (_selSessRoutine === "sh90" ? `Day ${_selSess.day}` : dayData?.label)
                  : routine === "sh90" ? `Day ${day}` : ["", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"][day]}
              </div>
              <div style={{ fontSize: fs(14), color: t.accent, fontWeight: 500 }}>{dayData?.label}</div>
              {crossRoutineSession && (
                <div style={{ fontSize: fs(11), color: t.textDim, marginTop: 3 }}>
                  Logged with {ROUTINES[_selSessRoutine]?.name} — switch routines in Me to edit its schedule
                </div>
              )}
              {dayData?.desc && (
                <div style={{ fontSize: fs(11), color: t.textDim, marginTop: 3, lineHeight: 1.5 }}>{dayData.desc}</div>
              )}
            </div>
            )}

            {/* ── Yoga Library ── */}
            {routine === "yoga" && !selectedSession && (() => {
              const CATS = [
                { key: "morning", label: "🌅 Morning" },
                { key: "flow", label: "🌊 Full Body Flow" },
                { key: "power", label: "🔥 Power & Strength" },
                { key: "stretch", label: "🧵 Deep Stretch" },
                { key: "evening", label: "🌙 Evening Wind-Down" },
                { key: "beginner", label: "🌱 Foundations" },
              ];
              const isFutureDate = selectedDate > todayStr;
              return (
                <div>
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ fontSize: fs(20), fontWeight: 700 }}>Yoga Session</div>
                    <div style={{ fontSize: fs(12), color: t.textDim, marginTop: 2 }}>
                      Pick a video, follow along on YouTube, then mark it done.
                    </div>
                  </div>
                  {CATS.map(cat => {
                    const vids = YOGA_VIDEOS.filter(v => v.category === cat.key);
                    if (vids.length === 0) return null;
                    return (
                      <div key={cat.key} style={{ marginBottom: 16 }}>
                        <div style={{ fontSize: fs(11), color: t.textDim, marginBottom: 8, fontFamily: "'DM Mono', monospace", letterSpacing: 1, textTransform: "uppercase" }}>
                          {cat.label}
                        </div>
                        {vids.map(v => (
                          <div key={v.id} style={{
                            background: t.card, borderRadius: 14, marginBottom: 8, overflow: "hidden",
                            border: `1px solid ${t.border}`, display: "flex", alignItems: "stretch",
                          }}>
                            <a href={`https://www.youtube.com/watch?v=${v.id}`} target="_blank" rel="noopener noreferrer"
                              style={{ flexShrink: 0, width: 110, display: "block", position: "relative", background: "#000" }}>
                              <img src={`https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`} alt={v.title}
                                style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", opacity: 0.9 }} />
                              <span style={{
                                position: "absolute", inset: 0, display: "flex", alignItems: "center",
                                justifyContent: "center", fontSize: 22, textShadow: "0 1px 6px rgba(0,0,0,0.7)",
                              }}>▶️</span>
                            </a>
                            <div style={{ flex: 1, padding: "10px 12px", minWidth: 0 }}>
                              <div style={{ fontSize: fs(13), fontWeight: 600, lineHeight: 1.3 }}>{v.title}</div>
                              <div style={{ fontSize: fs(11), color: t.textDim, marginTop: 2, fontFamily: "'DM Mono', monospace" }}>
                                {v.channel} · {v.duration}
                              </div>
                              {!isFutureDate && (
                                <button onClick={() => {
                                    const sess = {
                                      routine: "yoga", label: v.title, channel: v.channel, videoId: v.id,
                                      status: "completed", completedAt: new Date().toISOString(),
                                    };
                                    setSessionLog(prev => ({ ...prev, [selectedDate]: sess }));
                                    syncSession(selectedDate, sess);
                                    toggleHabit(3, true);
                                  }}
                                  style={{
                                    marginTop: 6, padding: "5px 12px", borderRadius: 8,
                                    border: `1px solid ${t.success}50`, background: "transparent",
                                    color: t.success, fontSize: fs(11), fontWeight: 600,
                                    cursor: "pointer", fontFamily: "inherit",
                                  }}>
                                  ✓ Mark Done
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              );
            })()}

            {/* Exercise List */}
            {exercises.map((ex, idx) => {
              const isExpanded = expandedEx === idx;
              const currentDisplay = displayName(ex.name);
              const isSwapped = currentDisplay !== ex.name;
              const isBW = currentDisplay.startsWith("BW:");
              const isTimedEx = isBW && /hold|plank|l-sit|wall sit|iso/i.test(currentDisplay);
              const prevResult = getPrevWeekResult(currentDisplay);
              const history = getExerciseHistory(currentDisplay);
              // Check if all sets of this exercise are done
              let exAllDone = ex.sets > 0;
              for (let si = 0; si < ex.sets; si++) {
                if (!logData[`${selectedDate}-${currentDisplay}-${si}`]?.done) { exAllDone = false; break; }
              }

              return (
                <div key={idx} style={{
                  background: t.card, borderRadius: 14, marginBottom: 8,
                  border: `1px solid ${isExpanded ? t.accent + "40" : exAllDone ? t.success + "40" : t.border}`,
                  overflow: "hidden", transition: "border-color 0.2s",
                }}>
                  {/* Exercise Row */}
                  <button
                    onClick={() => setExpandedEx(isExpanded ? null : idx)}
                    style={{
                      width: "100%", padding: "14px 16px", border: "none",
                      background: "transparent", cursor: "pointer", display: "flex",
                      alignItems: "center", gap: 12, color: t.text, fontFamily: "inherit",
                    }}
                  >
                    <div style={{
                      width: 32, height: 32, borderRadius: 8,
                      background: exAllDone ? t.success : t.accentGlow,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: exAllDone ? fs(14) : fs(12), fontWeight: 700,
                      color: exAllDone ? "#fff" : t.accent, flexShrink: 0,
                      fontFamily: "'DM Mono', monospace",
                    }}>
                      {exAllDone ? "✓" : idx + 1}
                    </div>
                    <div style={{ flex: 1, textAlign: "left" }}>
                      <div style={{ fontSize: fs(14), fontWeight: 500, lineHeight: 1.3 }}>
                        {isSwapped && <span style={{ color: t.warning, fontSize: fs(10), marginRight: 4 }}>⇄</span>}
                        {isBW && <span style={{
                          fontSize: fs(9), fontWeight: 700, color: t.accent, background: t.accentGlow,
                          padding: "1px 5px", borderRadius: 4, marginRight: 4, verticalAlign: "middle",
                          fontFamily: "'DM Mono', monospace",
                        }}>BW</span>}
                        {currentDisplay.replace(/^BW:\s*/, "")}
                      </div>
                      <div style={{ fontSize: fs(12), color: t.textDim, marginTop: 2, fontFamily: "'DM Mono', monospace" }}>
                        {(() => {
                          // Check if any sets are logged for this exercise today
                          const loggedSets = [];
                          for (let si = 0; si < ex.sets; si++) {
                            const lk = `${selectedDate}-${currentDisplay}-${si}`;
                            const lv = logData[lk];
                            if (lv?.done && (lv.weight || lv.reps)) {
                              loggedSets.push(lv);
                            }
                          }
                          if (loggedSets.length > 0) {
                            // Show actual logged data
                            const summary = loggedSets.map((s, i) =>
                              isBW
                                ? `${s.reps || "?"}${isTimedEx ? "s" : ""}`
                                : `${s.weight || 0}×${s.reps || "?"}`
                            ).join(", ");
                            return <span style={{ color: t.success }}>{summary}{isBW && loggedSets[0]?.weight ? ` (+${loggedSets[0].weight})` : !isBW ? " lbs" : ""}</span>;
                          }
                          // Show prescribed reps
                          return (
                            <>
                              {ex.sets}×{ex.reps}{isTimedEx ? "s" : ""}
                              {!isBW && ex.result && <span style={{ color: t.accent, marginLeft: 8 }}>{ex.result} lbs</span>}
                              {!ex.result && prevResult && <span style={{ color: t.textMuted, marginLeft: 8 }}>prev: {prevResult}</span>}
                            </>
                          );
                        })()}
                      </div>
                    </div>
                    <span style={{ fontSize: fs(12), color: t.textDim, transform: isExpanded ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>▼</span>
                  </button>

                  {/* Expanded Detail */}
                  {isExpanded && (
                    <div style={{ padding: "0 16px 16px", borderTop: `1px solid ${t.border}` }}>
                      {/* Notes */}
                      {ex.notes && (
                        <div style={{
                          margin: "12px 0 10px", padding: "8px 12px", borderRadius: 8,
                          background: t.accentGlow, fontSize: fs(12), color: t.accent,
                          fontStyle: "italic",
                        }}>
                          {ex.notes}
                        </div>
                      )}

                      {/* Previous week */}
                      {prevResult && (
                        <div style={{ fontSize: fs(12), color: t.textDim, marginTop: 10, marginBottom: 6 }}>
                          Last: <span style={{ color: t.text, fontWeight: 600 }}>{prevResult}</span>
                        </div>
                      )}

                      {/* Set Logging */}
                      <div style={{ marginTop: 10 }}>
                        <div style={{ fontSize: fs(11), color: t.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 1, fontFamily: "'DM Mono', monospace" }}>Log Sets</div>
                        {Array.from({ length: ex.sets }, (_, si) => {
                          const logKey = `${selectedDate}-${currentDisplay}-${si}`;
                          const val = logData[logKey] || {};
                          return (
                            <div key={si} style={{
                              display: "flex", gap: 8, marginBottom: 6, alignItems: "center",
                            }}>
                              <span style={{
                                width: 24, fontSize: fs(11), color: t.textDim, fontFamily: "'DM Mono', monospace",
                              }}>S{si + 1}</span>
                              <input
                                type="number" placeholder={isBW ? "+lbs" : "Weight"}
                                value={val.weight || ""}
                                onChange={e => {
                                  const v = e.target.value;
                                  setLogData(prev => {
                                    const cur = prev[logKey] || {};
                                    const next = { ...prev, [logKey]: { ...cur, weight: v } };
                                    if (!cur.done && cur.reps && (v || isBW)) {
                                      next[logKey] = { ...next[logKey], done: true, completedAt: new Date().toISOString(), date: selectedDate };
                                      // Auto-check Workout habit at 50%+ exercise completion
                                      let tEx = exercises.length, dEx = 0;
                                      exercises.forEach(e2 => {
                                        const dn2 = displayName(e2.name);
                                        let ad = e2.sets > 0;
                                        for (let s2 = 0; s2 < e2.sets; s2++) { if (!next[`${selectedDate}-${dn2}-${s2}`]?.done) { ad = false; break; } }
                                        if (ad) dEx++;
                                      });
                                      if (tEx > 0 && (dEx / tEx) >= 0.5) toggleHabit(3, true);

                            <div style={{ fontSize: fs(13), fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{tk.subject}</div>
                            <div style={{ fontSize: fs(10), color: t.textDim, fontFamily: "'DM Mono', monospace" }}>
                              {tk.category} · {tk.priority} · {new Date(tk.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric" })}
                              {tk.messages.length > 0 && ` · ${tk.messages.length} 💬`}
                            </div>
                          </div>
                          <span style={{ fontSize: fs(10), color: t.textDim, transform: isExp ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>▼</span>
                        </div>
                        {isExp && (
                          <div style={{ padding: "0 12px 12px" }}>
                            <div style={{ fontSize: fs(12), color: t.textDim, lineHeight: 1.5, whiteSpace: "pre-wrap", marginBottom: 8 }}>{tk.body}</div>
                            {tk.resolution_note && (
                              <div style={{ padding: "8px 10px", borderRadius: 8, background: t.success + "12", fontSize: fs(12), color: t.text, lineHeight: 1.5, marginBottom: 8 }}>
                                ✅ {tk.resolution_note}
                              </div>
                            )}
                            {tk.messages.map(m => (
                              <div key={m.id} style={{
                                padding: "8px 10px", borderRadius: 8, marginBottom: 6,
                                background: m.author === "agent" ? t.accentGlow : t.card,
                                fontSize: fs(12), lineHeight: 1.5, whiteSpace: "pre-wrap",
                              }}>
                                <div style={{ fontSize: fs(9), color: t.textDim, fontFamily: "'DM Mono', monospace", marginBottom: 2, textTransform: "uppercase" }}>
                                  {m.author === "agent" ? "🤖 maintenance agent" : "you"} · {new Date(m.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric" })}
                                </div>
                                {m.body}
                              </div>
                            ))}
                            {/* Owner controls — resolve/reopen without waiting for the agent */}
                            <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                              {!["resolved", "closed"].includes(tk.status) ? (
                                <button onClick={() => setTicketStatus(tk.id, "resolved")}
                                  style={{
                                    padding: "6px 12px", borderRadius: 8, border: `1px solid ${t.success}50`,
                                    background: "transparent", color: t.success, fontSize: fs(11),
                                    fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
                                  }}>
                                  ✓ Mark Resolved
                                </button>
                              ) : (
                                <button onClick={() => setTicketStatus(tk.id, "open")}
                                  style={{
                                    padding: "6px 12px", borderRadius: 8, border: `1px solid ${t.border}`,
                                    background: "transparent", color: t.textDim, fontSize: fs(11),
                                    fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
                                  }}>
                                  Reopen
                                </button>
                              )}
                            </div>
                            <div style={{ display: "flex", gap: 6 }}>
                              <input
                                placeholder="Reply..."
                                value={isExp ? ticketReply : ""}
                                onChange={e => setTicketReply(e.target.value)}
                                onKeyDown={e => { if (e.key === "Enter") replyToTicket(tk.id); }}
                                style={{
                                  flex: 1, padding: "8px 10px", borderRadius: 8, border: `1px solid ${t.border}`,
                                  background: t.card, color: t.text, fontSize: fs(12), fontFamily: "inherit",
                                  outline: "none", minWidth: 0, boxSizing: "border-box",
                                }}
                              />
                              <button onClick={() => replyToTicket(tk.id)} disabled={!ticketReply.trim()}
                                style={{
                                  padding: "8px 12px", borderRadius: 8, border: "none",
                                  background: ticketReply.trim() ? t.accent : t.card, color: ticketReply.trim() ? "#fff" : t.textMuted,
                                  fontSize: fs(12), fontWeight: 600, cursor: "pointer", fontFamily: "inherit", flexShrink: 0,
                                }}>↑</button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
              {tickets && tickets.length === 0 && !ticketsError && (
                <div style={{ fontSize: fs(12), color: t.textDim, textAlign: "center", padding: "8px 0" }}>
                  No tickets yet.
                </div>
              )}
            </div>

            </>)}
            {meSubPage === null && (<>
            {/* ── App Version ── */}
            <div style={{
              textAlign: "center", padding: "16px 0 8px",
              fontSize: fs(11), color: t.textMuted, fontFamily: "'DM Mono', monospace",
            }}>
              Superhuman 90 · v3.8
            </div>
            </>)}
          </div>
        )}
      </div>

      {/* ── Bottom Navigation ── */}
      <div style={{
        position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
        width: "100%", maxWidth: 430, padding: "16px 16px 20px",
        background: `linear-gradient(transparent, ${t.bg} 30%)`, zIndex: 50,
      }}>
        <div style={{
          display: "flex", background: t.card, borderRadius: 16,
          border: `1px solid ${t.border}`, padding: 4,
        }}>
          {[
            { id: "habits", label: "Habits", icon: "✅" },
            { id: "workout", label: "Workout", icon: "🏋️" },
            { id: "coach", label: "Coach", icon: "🤖" },
            { id: "progress", label: "Progress", icon: "📊" },
            { id: "profile", label: "Me", icon: "👤" },
          ].map(({ id, label, icon }) => (
            <button key={id} onClick={() => setTab(id)}
              style={{
                flex: 1, padding: "10px 0", borderRadius: 12, border: "none",
                background: tab === id ? t.gradient : "transparent",
                color: tab === id ? "#fff" : t.textDim,
                cursor: "pointer", fontSize: Math.min(fs(11), 15), fontWeight: 600, fontFamily: "inherit",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
                minWidth: 0, overflow: "hidden",
              }}
            >
              <span style={{ fontSize: fs(16) }}>{icon}</span>
              {label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}


    // Render app — waits for cloud restore if localStorage is empty
    function doRender() {
      ReactDOM.createRoot(document.getElementById("root")).render(<SuperhumanApp />);
    }
    if (window.__sh90_ready) {
      doRender();
    } else {
      window.__sh90_renderApp = doRender;
    }

  </script>
  <script>
    // ── App version for cache busting ──
    var APP_VERSION = 'v3.10';

    // Register service worker — force update on new deploys (CredentialDOMD pattern,
    // hardened): updateViaCache 'none' so the browser never serves a cached sw.js,
    // and controllerchange (the reliable signal that a new worker took over) drives
    // the reload instead of per-worker statechange.
    if ('serviceWorker' in navigator) {
      var _reloadingForSW = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (_reloadingForSW) return;
        _reloadingForSW = true;
        window.location.reload();
      });
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function(reg) {
        reg.update();
        // A new worker is already installed and waiting → activate it now
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
        reg.addEventListener('updatefound', function() {
          var newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          }
        });
      });
    }

    // ── Force-update check ──
    // Fetch a tiny version file on launch AND whenever the app is resumed.
    // If it differs from the baked-in APP_VERSION, nuke caches and hard-reload —
    // a PWA resumed from the app switcher never re-runs its launch code, which
    // is why deploys used to be invisible until a force-quit.
    (function() {
      var checking = false;
      function checkVersion() {
        if (checking) return;
        checking = true;
        fetch('./version.txt?t=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.text(); })
          .then(function(remote) {
            checking = false;
            remote = (remote || '').trim();
            // Sanity: only act on a real version string (a 404 page must not trigger reloads)
            if (!/^v[\d.]+$/.test(remote) || remote === APP_VERSION) return;
            // Throttle: never force-reload more than once a minute (guards reload loops).
            // When throttled, tell the app so it can show an "update ready" banner
            // instead of silently doing nothing.
            var last = parseInt(sessionStorage.getItem('sh90_last_forced_reload') || '0', 10);
            if (Date.now() - last < 60000) {
              // Buffer too: at launch this fires while Babel is still
              // compiling the app, before any React listener exists
              window.__sh90_pendingUpdate = remote;
              window.dispatchEvent(new CustomEvent('sh90-update-ready', { detail: { version: remote } }));
              return;
            }
            sessionStorage.setItem('sh90_last_forced_reload', String(Date.now()));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).then(function() { window.location.reload(); });
            } else {
              window.location.reload();
            }
          })
          .catch(function() { checking = false; });
      }
      checkVersion();
      function resumeCheck() {
        checkVersion();
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistration().then(function(r) { if (r) r.update(); });
        }
      }
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') resumeCheck();
      });
      // iOS resume from the back/forward cache doesn't always fire visibilitychange
      window.addEventListener('pageshow', function(e) { if (e.persisted) resumeCheck(); });
      window.addEventListener('focus', resumeCheck);
      setInterval(checkVersion, 15 * 60 * 1000);
    })();
  </script>
